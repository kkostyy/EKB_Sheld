# EKB SHIELD — AdvanceEnchantmentX 1.0.0 (Archit)
#
# Плагин добавлен ради ОДНОЙ чары — Mining3x3 («Бур 3×3»): кирка ломает
# плоскость 3×3, чара кладётся книгой на наковальне и работает нативно.
# Раньше эту механику делал docs/drill.sk — он снят, потому что два
# механизма на один предмет конфликтовали бы (тот же принцип, что «Jail
# не ставим — тюрьма на Skript» в CLAUDE.md).
#
# ⚠️ ВСЕ ОСТАЛЬНЫЕ ЧАРЫ ВЫКЛЮЧЕНЫ НАМЕРЕННО (`enabled: false`). В плагине их
# больше сорока, и среди них GodMode, MeteorStrike, TimeWarp, Execute,
# Lifesteal — на выживальном RP-сервере с Судом это не «контент», а слом
# баланса и половины исков УК. Просили ровно бур 3×3 — включён ровно он.
# Вернуть любую чару = `enabled: true` у неё + `/aex reload`.
#
# ⚠️ `chance-to-find` у всех редкостей обнулён: сервер стоит на том, что всё
# добыто руками (та же логика, что `-headdb.head.take`, конопля только из
# семян). Книга чары не находится в мире вообще — её выдаёт только админ
# командой `/aex give <ник> Mining3x3 1` (право `aex.admin.give`), а игроки
# получают через `/drillbook` (обёртка в menu_give.sk) или с аукциона.
#
# ⚠️ `require-permissions: false` оставлено намеренно: право нужно на ВЫДАЧУ
# книги, а не на её использование. Купивший бур на аукционе должен им копать,
# не выпрашивая ноду у админа.
#
# ⚠️ `worldguard-support: true` — плагин уважает регионы WorldGuard. На привате
# Спавна бур копать не должен; проверить это живьём (у Skript-версии защита
# держалась на `can build`, здесь — на этом флаге).

# ====================================================== #
#               AdvanceEnchantmentX Config               #
# ====================================================== #

settings:
  # Do enchants require permission to use?
  require-permissions: false
  
  # Protect against taking damage in worldguard regions if disabled?
  worldguard-support: true
  
  # Max custom enchants an item can have by default
  max-enchants: 5
  
  # The glow effect for custom enchanted items? (Uses hidden vanilla enchant)
  glow: true

rarities:
