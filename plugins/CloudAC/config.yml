# EKB SHIELD — CloudAC 1.0.8 (SpigotMC 136771, MrResi/SkyDev)
#
# Античит на четыре БОЕВЫЕ проверки: killaura, hitbox, reach, wallhit.
# Движение, полёт и X-Ray он НЕ проверяет вообще — их в jar'е нет
# (`mrresi/cloudac/checks/combat/` — единственная папка проверок).
# Правило 3.7 закрывает и Fly, и X-Ray, но ловить их этим плагином не выйдет:
# для них нужен второй античит или глаза Администрации.
#
# Зависит от PacketEvents — он у нас уже стоит (packetevents-spigot-2.13.0),
# отдельно ставить нечего.
#
# ⚠️ Значения самих проверок оставлены АВТОРСКИМИ. Их подбирали под матчасть
# проверок, а у нас нет ни одного замера: reach 3.1 при лаге даёт ложные
# срабатывания, но занижать или задирать его вслепую — значит менять цифру,
# смысла которой мы не знаем. Правится после первых живых алертов, а не до.
#
# ⚠️ Плагину два дня (обновлён 17.09.2026), 280 скачиваний, версии в теге
# SpigotMC — до 1.21, метки 26.x нет. На 26.1.2 он держится только на
# PacketEvents. Если после перезапуска в логе будут исключения на каждый удар
# — снести и не мучить, наказаний он всё равно не выносит (см. punishments.yml).

language: ru

checks:
  # Автокликер/килл-аура: бьёт по невозможной траектории.
  killaura:
    enabled: true
    alert-vl: 3
    cancel-damage: true

  # Хитбокс: удар мимо модели, но «в цель».
  hitbox:
    enabled: true
    alert-vl: 5
    cancel-vl: 3
    cancel-damage: true
    ping-buffer-ticks: 2
    vl-on-miss: 2
    vl-decay-on-hit: 1

  # Дальность удара. Ванильная — 3 блока.
  reach:
    enabled: true
    max-reach: 3.1
    alert-vl: 5
    cancel-vl: 3
    cancel-damage: true
    ping-buffer-ticks: 2
    vl-decay-on-hit: 1

  # Удар сквозь стену.
  #
  # ⚠️ Это единственная проверка, у которой ЕСТЬ законный повод сработать на
  # нашем сервере: плагин AttackThrough 1.0.2 стоит как раз для ударов сквозь
  # некоторые блоки. Если после запуска посыплются отмены урона там, где
  # AttackThrough его разрешает, — выключать надо здесь, а не там.
  wallhit:
    enabled: true
    cancel-damage: true
