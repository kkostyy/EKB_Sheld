# EKB SHIELD — наказания CloudAC
#
# ⚠️ ВСЕ АВТОМАТИЧЕСКИЕ НАКАЗАНИЯ ВЫКЛЮЧЕНЫ, И ЭТО ГЛАВНАЯ ПРАВКА ФАЙЛА.
#
# В дефолте плагин при уверенности нейросети 0.95 сам выдаёт
# `tempban %player% 7d`, а на пороге VL — кикает. На этом сервере так нельзя
# сразу по трём причинам:
#
# 1. Модель никто не проверял. Плагину два дня, 280 скачиваний, замеров у нас
#    ноль. Автобан на неделю по вероятности — это ставка чужой моделью на
#    чужого игрока.
# 2. PvP здесь сюжетный. Контракты (`docs/contracts.sk`), войны городов и
#    самосуд по Ст. 4-5 УК — это нормальные драки, а не аномалия. Ложный кик
#    посреди исполнения контракта ломает сцену, которую потом разбирает Суд.
# 3. Наказания на этом сервере назначает человек. Нарушение Правила 3.7
#    (стороннее ПО) — дело Администрации, а не автоматики: бан выдаёт админ,
#    посмотрев алерты и логи CoreProtect.
#
# Что работает при выключенных наказаниях: алерты в чат тем, у кого есть
# `cloudac.alerts` (главный админ и помощник — `plugins/LuckPerms/groups.yml`),
# и отмена урона по настройкам `config.yml`. То есть чит нейтрализуется на
# месте, а решение по игроку принимает человек.
#
# ⚠️ Алерты идут ИГРОКАМ в чат, а не в консоль, поэтому в Discord через
# DiscordSRV они НЕ попадают. Нужен след в канале Администрации — включай
# ниже `vl-punishments` с действием COMMAND и командой, которая пишет
# в консоль, а не с KICK.
#
# Включать автонаказания — только после того, как соберём живую статистику
# ложных срабатываний. Порядок: сначала неделя алертов, потом KICK на
# завышенном пороге, и только потом разговор про бан.

ai-punishments:
  enabled: false
  threshold: 0.95
  actions:
    - "COMMAND"
  kick-message: "&c&lCloudAC &8» &fВы были отключены за использование стороннего ПО (AI)."
  commands:
    - "tempban %player% 7d Стороннее ПО (AI)"

vl-punishments:
  killaura:
    enabled: false
    threshold: 15
    actions:
      - "KICK"
    kick-message: "&c&lCloudAC &8» &fВы были отключены по подозрению в KillAura."
    commands: []
  reach:
    enabled: false
    threshold: 8
    actions:
      - "KICK"
    kick-message: "&c&lCloudAC &8» &fВы были отключены по подозрению в Reach."
    commands: []
  hitbox:
    enabled: false
    threshold: 8
    actions:
      - "KICK"
    kick-message: "&c&lCloudAC &8» &fВы были отключены по подозрению в Hitbox."
    commands: []
