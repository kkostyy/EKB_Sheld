# EKB SHIELD — plugins/FasterMinecarts/config.yml
# FasterMinecarts 1.0 (Modrinth «Faster Minecarts», paper/purpur/spigot, 26.1.2).
#
# Зачем: Конституция 1.1 запрещает игрокам телепорты (-essentials.tpa,
# -essentials.home и далее по списку в plugins/LuckPerms/groups.yml).
# Значит рельсы — единственный быстрый транспорт в игре, и ванильные
# 8 блоков/с делают Незер-метро бессмысленным на дистанциях, которые
# даёт граница мира в стадии 5 (20 000 блоков, docs/world_border.md).
#
# max-speed — в блоках за тик. Ваниль — 0.4 (8 блоков/с).
# 1.6 = 32 блока/с, вчетверо быстрее ванили.
#
# ⚠️ Выше 2.0 не поднимать. Вагонетка едет быстрее, чем сервер успевает
# подгружать чанки по курсу: игрока начинает выкидывать в «пустоту» и
# откатывать назад, а на длинной ветке это ещё и постоянная догрузка
# чанков под одним игроком — ровно та нагрузка, от которой в проекте
# стоит Chunky с предгенерацией.
max-speed: 1.6
