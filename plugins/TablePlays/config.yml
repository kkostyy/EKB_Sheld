# EKB SHIELD — plugins/TablePlays/config.yml
# TablePlays 3.14159-1 (Modrinth, bukkit/paper/purpur/spigot, 26.1.2).
# Настольные игры: фишки, кости, карты как display-сущности на столе.
#
# ⚠️ Русский язык у плагина свой, в jar лежат en.yml и ru.yml — ставим ru.
#
# ⚠️ CustomModelData. Плагин вешает свои модели на ванильные предметы через
# basecmd и занимает весь диапазон 33000-33790 (карты 33000, наборы 33100,
# шашки 33200, шахматы 33210, доски 33230, нарды 33240, домино 33300,
# кости 33400, фишки 33770). У проекта заняты 1001-1014 (BreweryX),
# 2001-2016 (Nirvana), 6666 (Тетрадь), 7001-7003 и 7200 (тюрьма) —
# пересечений нет. Базовые предметы пересекаются: PAPER и DIAMOND наш пак
# уже переопределяет. Это не страшно: range_dispatch на неизвестный порог
# отдаёт базовую модель, то есть до мерджа моделей TablePlays в
# shield_resourcepack фишки просто выглядят обычной бумагой и алмазом.
#
# ⚠️ Пересечение с MiniBoardGames, который уже стоит на сервере: тот даёт
# шахматы/шашки доской-интерфейсом, TablePlays — физические фишки и кости
# на столе. Оставлены оба намеренно; если решишь убрать один, убирай
# MiniBoardGames — у TablePlays есть русская локализация.

lang: ru

# Крупные наборы (колода, стопка фишек) складывать в saved.yml, а не в NBT
# предмета: раздутый тег предмета — это трафик на каждый клик по инвентарю.
allow_files: true
file_threshold: 36

# 64 фишки в стопке — потолок плагина по его же комментарию; выше начинается
# заметный лаг на каждой раздаче. Взято 32: столу на четверых хватает,
# а казино Бармена не должно ронять тик.
chip_bundle_size: 32

