# EKB SHIELD — ClientID 1.1.7
#
# Плагин спрашивает у клиента список модов и ресурспаков через плагин-канал
# `clientid:modlist`. Отвечает только тот, у кого установлен клиентский мод
# ClientID — обычный ваниль-клиент молчит.
#
# ⚠️ requireMod: false — И ЭТО ГЛАВНАЯ ПРАВКА.
# В дефолте стоит true, а это значит две вещи сразу (сверено по jar'у:
# PlayerActionListeners и PlayerConnectionListeners читают один и тот же
# ключ): вошедшему без мода отменяются движение, удары, ломание и
# постановка блоков — он стоит столбом, — а через несколько секунд его
# выкидывает с «Failed ClientID check».
# В логе 18.09.2026 так и случилось: «Player kosyvx failed to respond in a
# timely fashion» → «lost connection: Failed ClientID check». Мода ClientID
# в нашем модпаке нет (`client_modpack/modrinth.index.json`, 10 модов),
# то есть кикало вообще всех, включая администратора.
#
# Что осталось работать при false: у кого мод СТОИТ, тот по-прежнему
# присылает список, и запреты ниже к нему применяются. Ваниль-клиент просто
# заходит и играет. Хочешь вернуть true — сначала добавь мод в модпак,
# и учти, что тогда без модпака на сервер не зайти вообще.
requireMod: false

# Запрещённые моды: совпадение по куску имени.
#
# ⚠️ Список СТОКОВЫЙ, только `freecam` из него убран и внесён
# в whitelist ниже. Ничего своего сюда добавлять НЕЛЬЗЯ без решения
# владельца сервера: 18.09.2026 добавленные «meteor-client» и «impact»
# выкинули с сервера самого главного админа с сообщением
# «The following mods must be removed to play».
#
# ⚠️ `freecam` ИЗ СПИСКА УБРАН и внесён в whitelist.
# Мы сами раздаём FreeCam в клиентском модпаке (`mods/freecam.jar`,
# Modrinth XeEZ3fK2) — с дефолтным конфигом сервер кикал за мод,
# который сам же и выдал. В whitelist у плагина по умолчанию лежал
# `legacy-freecam` — это другой мод.
keywordBans:
- xray
- x-ray

# Точное совпадение ID мода. Список стоковый.
blacklist:
- wurst

# Обход keywordBans и blacklist по ТОЧНОМУ id мода.
# freecam — наш, из модпака. Лазейка узкая намеренно: любой другой мод со
# словом freecam в имени по-прежнему ловится keywordBans, разрешена ровно
# та сборка, которую мы проверили и раздаём.
whitelist:
- freecam
- legacy-freecam

# Ники, которым можно всё. User1/User2 из дефолта убраны: это примеры, и
# при неудачном совпадении ника они стали бы настоящей дырой.
playerBypass: []

# true превращает playerBypass в чёрный список: мод требуется ТОЛЬКО от
# перечисленных. При requireMod: false значения не имеет.
reversePlayerBypass: false

# Круговая диаграмма установленных модов при входе.
disablePieChart: false
