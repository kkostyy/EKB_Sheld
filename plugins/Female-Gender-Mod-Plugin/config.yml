# EKB SHIELD — plugins/Female-Gender-Mod-Plugin/config.yml
# Female-Gender-Mod-Plugin 1.6.0 (Modrinth female-gender-spigot,
# bukkit/paper/purpur/spigot, 26.1.2).
#
# Это НЕ мод, а серверный ретранслятор: он пересылает между клиентами
# настройки модели из клиентского мода Wildfire's Female Gender Mod.
# Без мода на клиенте игрок ничего не увидит и ничего не сломает —
# поэтому мод добавлен в client_modpack, а плагин на сервере просто
# следит, чтобы настройки одного игрока доехали до остальных.
#
# Соседство с CustomPlayerModels (CPM), который уже стоит: CPM подменяет
# модель целиком по своему формату, этот плагин правит только ванильную
# модель игрока. Пакеты разные, конфликта нет.

config-version: 0.2

mod:
  # -1 — брать самый новый известный плагину протокол. Фиксировать номер
  # руками нужно только если клиентский мод отстал от плагина: на
  # незадокументированном протоколе плагин выключает сам себя при старте
  # и пишет об этом в лог.
  protocol: -1

logging:
  enabled: true
  debug: false
