# EKB SHIELD — DeluxeMenus
# Меню разложены по файлам в gui_menus/. Открываются командами (open_command)
# и кнопками внутри меню ([openguimenu] <id>).
#
# Права на ролевые меню (выдаются в LuckPerms, см. plugins/LuckPerms/groups.yml):
#   ekb.menu.admin    — Администрация (группа admin)
#   ekb.menu.helper   — Помощник админа (группа restricted_admin)
#   ekb.menu.citizen  — гражданин государства
#   ekb.menu.capital  — житель Спавна (город САП)
#   ekb.menu.nomad    — кочевник; выдаётся группе default по умолчанию
#   ekb.menu.judge    — судья (Судебная Коллегия)
#   ekb.menu.doctor   — врач Клиники
#
# Обновление 18.09.2026 — восемь новых разделов:
#   ekb.shadow.member      — Теневой Рынок (меню целиком под правом)
#   ekb.duty.journalist    — сдача выпуска и экстренные новости в Газете
#   ekb.media.streamer     — кнопка анонса эфира (её же видит ютубер)
#   coreprotect.rollback   — «Назначить Сон» и список происшествий
#   ekb.duty.clerk         — приказчик Мэрии: Казна, аренда, скупщик
#   ekb.duty.barman        — бармен: стойка и вытрезвитель
#   ekb.duty.dealer        — крупье: настольные наборы и кости
#   ekb.duty.detective     — следователь: осмотр мест убийств
# Роли выдаются головами: /ekbroles (docs/menu_roles.sk).
#
# /menu открыто всем: внутри показываются только те разделы, на которые
# у игрока есть право (view_requirement у каждой кнопки).

debug: HIGHEST   # LOWEST печатал в лог сотни строк «requirement» на каждый /dm reload
