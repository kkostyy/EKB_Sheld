menu_title: '&8Надзор и техника'
open_command:
  - admintech
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'rolecolor':
    material: NAME_TAG
    slot: 13
    display_name: '&e&lТег роли'
    lore:
      - '&7Тег в чате и TAB ставится сам по роли.'
      - '&7Кнопка пересчитывает твой немедленно.'
      - ''
      - '&aЛКМ &8— пересчитать'
    left_click_commands:
      - '[close]'
      - '[player] rolecolor<delay=2>'

  'kbind':
    material: TRIPWIRE_HOOK
    slot: 22
    display_name: '&f&lГорячие клавиши'
    lore:
      - '&7Клавиша -> команда для всех игроков с модом.'
      - '&7Окно правки: добавить, изменить, удалить.'
      - ''
      - '&aЛКМ &8— редактор'
    left_click_commands:
      - '[close]'
      - '[player] kbind manage<delay=2>'

  'header':
    material: OBSERVER
    slot: 4
    display_name: '&3&lНадзор и техника'
    lore:
      - '&7Плагины обновления 27.09.2026.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

