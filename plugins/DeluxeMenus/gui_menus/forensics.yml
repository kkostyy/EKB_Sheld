menu_title: '&8Криминалистика'
open_command:
  - forensics
  - улики
size: 54

items:

  'run':
    material: SPYGLASS
    slot: 13
    display_name: '&9&lОсмотреть место'
    lore:
      - '&7Встань там, где лежало тело, и запусти осмотр.'
      - '&b20💎&7 в Казну, шанс успеха &e50%&7.'
      - '&aЗа пустое поле денег не берут — проверка идёт до оплаты.'
      - '&cМесто осматривают один раз, удачно или нет.'
      - ''
      - '&aЛКМ &8— запустить осмотр'
    left_click_commands:
      - '[player] expertise'

  'open':
    material: PAPER
    slot: 20
    display_name: '&e&lОткрытые происшествия'
    lore:
      - '&7Где и когда убивали, без имён убийц.'
      - ''
      - '&aЛКМ &8— список'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: coreprotect.rollback
    left_click_commands:
      - '[player] crimescenes'

  'report':
    material: BOOK
    slot: 22
    display_name: '&c&lПодать обвинение'
    lore:
      - '&7Экспертиза только называет имя.'
      - '&7Дело заводит человек, а не скрипт.'
      - ''
      - '&aЛКМ &8— как подать'
    left_click_commands:
      - '[message] &c&lОБВИНЕНИЕ: &f/report <ник> убийство <жертва>'
      - '[message] &8Или иск в Discord: &f/иск'

  'logs':
    material: CLOCK
    slot: 24
    display_name: '&6&lЛоги CoreProtect'
    lore:
      - '&7Блоки и сундуки — отдельный источник улик.'
      - ''
      - '&aЛКМ &8— команды в чат'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: coreprotect.lookup
    left_click_commands:
      - '[message] &6&lЛОГИ: &f/co inspect &8· &f/co lookup u:<ник> t:1d r:10'

  'header':
    material: SPYGLASS
    slot: 4
    display_name: '&9&lКриминалистическая экспертиза'
    lore:
      - '&7Место преступления помнит убийцу трое суток.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
