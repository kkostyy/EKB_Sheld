menu_title: '&8Крупье'
open_command:
  - dealer
  - крупье
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.duty.dealer
      deny_commands:
        - '[message] &cЭто меню крупье.'

items:

  'cards':
    material: WARPED_FUNGUS_ON_A_STICK
    slot: 13
    display_name: '&f&lКолода'
    lore:
      - '&aЛКМ &8— выдать себе'
    model_data: 33000
    left_click_commands:
      - '[player] givetable card'

  'chips':
    material: WARPED_FUNGUS_ON_A_STICK
    slot: 20
    display_name: '&6&lФишки'
    lore:
      - '&aЛКМ &8— выдать себе'
    model_data: 33770
    left_click_commands:
      - '[player] givetable chip'

  'dice_item':
    material: WARPED_FUNGUS_ON_A_STICK
    slot: 22
    display_name: '&f&lКубики'
    lore:
      - '&aЛКМ &8— выдать себе'
    model_data: 33400
    left_click_commands:
      - '[player] givetable dice'

  'board':
    material: WARPED_FUNGUS_ON_A_STICK
    slot: 24
    display_name: '&e&lДоска и фигуры'
    lore:
      - '&7Убрать поставленную доску — клик по её'
      - '&7НИЖНЕЙ части, а не по фигурам сверху.'
      - ''
      - '&aЛКМ &8— доска'
      - '&aПКМ &8— шахматы'
    model_data: 33230
    left_click_commands:
      - '[player] givetable board'
    right_click_commands:
      - '[player] givetable chess'

  'domino':
    material: WARPED_FUNGUS_ON_A_STICK
    slot: 30
    display_name: '&f&lДомино и нарды'
    lore:
      - '&aЛКМ &8— домино'
      - '&aПКМ &8— нарды'
    model_data: 33300
    left_click_commands:
      - '[player] givetable domino'
    right_click_commands:
      - '[player] givetable nardy'

  'house':
    material: DROPPER
    slot: 31
    display_name: '&c&lКости заведения'
    lore:
      - '&7Ставка &b2💎&7, выигрыш &b5💎&7 при 5 или 6.'
      - '&7Деньги идут через Казну Спавна, не через тебя.'
      - ''
      - '&aЛКМ &8— бросить'
    left_click_commands:
      - '[player] dice'

  'howto':
    material: KNOWLEDGE_BOOK
    slot: 32
    display_name: '&e&lКак вести стол'
    lore:
      - '&f1. &7Возьми набор кнопкой выше.'
      - '&f2. &7ПКМ по столу — фигура встаёт на место.'
      - '&f3. &7ПКМ по самой фигуре — двигать и переворачивать.'
      - ''
      - '&c&lУбрать доску: &7клик по её НИЖНЕЙ части,'
      - '&7а не по фигурам сверху. Фигуры снимаются'
      - '&7по одной тем же кликом.'
      - ''
      - '&8Все наборы — один предмет (тёплый гриб на палке)'
      - '&8с разными CMD 33000-33790.'

  'header':
    material: OAK_PRESSURE_PLATE
    slot: 4
    display_name: '&d&lКрупье'
    lore:
      - '&7Держит стол: карты, фишки, кости.'
      - '&7Ставки между игроками — их дело, не плагина.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

