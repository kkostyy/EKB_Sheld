menu_title: '&8Шериф'
open_command:
  - sheriff
  - шериф
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.duty.sheriff
      deny_commands:
        - '[message] &cЭто меню шерифа.'

items:

  'calls':
    material: BELL
    slot: 13
    display_name: '&e&lЗаявки на патруль'
    lore:
      - '&7Вызовы, которые ещё никто не принял.'
      - ''
      - '&aЛКМ &8— открытые заявки'
    left_click_commands:
      - '[player] calls'

  'inspect':
    material: WOODEN_AXE
    slot: 20
    display_name: '&6&lОсмотр места'
    lore:
      - '&7ЛКМ/ПКМ по блоку — кто и когда его трогал.'
      - ''
      - '&aЛКМ &8— включить инспектор'
    left_click_commands:
      - '[player] co i'

  'jail':
    material: IRON_BARS
    slot: 22
    display_name: '&c&lКто сидит'
    lore:
      - '&7Заключённые и остаток срока.'
      - ''
      - '&aЛКМ &8— список'
    left_click_commands:
      - '[player] jailinfo'

  'report':
    material: BOOK
    slot: 24
    display_name: '&e&lПередать в Суд'
    lore:
      - '&7Шериф задерживает, судит — Суд.'
      - '&8/report <ник> <причина>'
      - ''
      - '&aЛКМ &8— как оформить'
    left_click_commands:
      - '[message] &8&lРапорт: &7/report <ник> <причина>'

  'law':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDEzODk5MDExMWUyYTAwZmJkMTYwMTM0ZTZiNzIxYTk3NzBlODgyZGZjZGEzY2NkMjk0ZTI4NDE5NDM5MDI3ZiJ9fX0=
    slot: 31
    display_name: '&f&lЧто считается нарушением'
    lore:
      - '&7Самосуд, кража, грабёж, демпинг,'
      - '&7лавка вне Рынка, побег из тюрьмы.'
      - ''
      - '&aЛКМ &8— статьи УК'
    left_click_commands:
      - '[openguimenu] ekb_laws'

  'header':
    material: IRON_SWORD
    slot: 4
    display_name: '&c&lШериф Спавна'
    lore:
      - '&7Порядок на Рынке и в нейтральной зоне.'
      - '&7Заявки приходят с координатами.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

