menu_title: '&8Кочевник'
open_command:
  - nomad
  - кочевник
size: 54

items:
  'who':
    material: LEATHER_BOOTS
    slot: 10
    display_name: '&7&lКто такой кочевник'
    lore:
      - '&7Ты ничей: ни государства, ни присяги,'
      - '&7ни налогов, ни защиты.'
      - ''
      - '&7Конституция защищает тебя ровно так же,'
      - '&7как и граждан: Суд принимает иск от любого.'
      - '&7Но за твою землю никто не вступится —'
      - '&7у тебя её просто нет.'

  'land':
    material: GRASS_BLOCK
    slot: 11
    display_name: '&a&lНейтральные земли'
    lore:
      - '&7Всё, что не занято государствами, —'
      - '&7нейтральная земля. Строй где хочешь.'
      - ''
      - '&4Но помни: приватов на сервере нет.'
      - '&4Твой сундук в лесу защищает только'
      - '&4CoreProtect и приговор Суда — постфактум.'
      - ''
      - '&7Земли, открывшиеся при расширении мира,'
      - '&7достаются всем на равных: преимущества'
      - '&7не имеет никто (Конституция 4.5).'

  'join':
    material: SHIELD
    slot: 12
    display_name: '&6&lКак стать гражданином'
    lore:
      - '&7Два пути:'
      - ''
      - '&f1. &7Вступить в существующее государство —'
      - '&7   договорись с Лидером, он подаст заявку.'
      - '&f2. &7Основать своё: нужен Лидер, от 3 граждан,'
      - '&7   территория и Устав в Discord.'
      - ''
      - '&7После признания Администрация выдаст'
      - '&7право &fekb.menu.citizen&7 и меню гражданина.'
      - '&8Конституция 2.3'

  'refugee':
    material: WHITE_BANNER
    slot: 13
    display_name: '&f&lСтатус беженца'
    lore:
      - '&7Не хочешь воевать — сдай оружие в Мэрию'
      - '&7Спавна и живи в нейтральной зоне.'
      - '&7База САП полностью безопасна.'
      - ''
      - '&8Конституция 5.6, 6.2'

  'danger':
    material: IRON_BARS
    slot: 14
    display_name: '&c&lЧего избегать'
    lore:
      - '&7Свободная жизнь не отменяет УК:'
      - ''
      - '&8Кража из чужих сундуков &7— возврат вдвое + 16💎'
      - '&8Грабёж с убийством &7— 32–64💎 и тюрьма от 10ч'
      - '&8Лавка вне Рынка &7— снос и конфискация'
      - '&8Побег из тюрьмы &7— срок удваивается'
      - ''
      - '&7Срок идёт в ОНЛАЙН-часах: отсидеться'
      - '&7в оффлайне не выйдет.'

  'survive':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjhhMDY1NTg4YzdkYmYxMjk0NTk1YWJhNzc3OTFjM2FkNjVmMTliZjFjOWFkN2E1YzIzZGE0MGI4Mjg2MGI3In19fQ==
    slot: 15
    display_name: '&b&lЖизнь в дороге'
    lore:
      - '&7Телепортов нет ни у кого, кроме САП'
      - '&7при исполнении. Всё расстояние — ногами.'
      - ''
      - '&7Граница мира растёт по достижениям:'
      - '&74000 → 20000 блоков. Нижний мир всегда'
      - '&71/8 от Обычного — по Аду дорога короче'
      - '&7в восемь раз.'

  'trade':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2QyNGRjNTgwNjljMTIxMmI1MjlhNGFlNWQ0ZTczYmUwOTkwZDQ2ZmU5MzcxYjFmNzllODE2NGI0Mjg1OWFjOCJ9fX0=
    slot: 16
    display_name: '&e&lТорговля и заработок'
    lore:
      - '&7Рыночная Площадь Спавна открыта всем,'
      - '&7включая кочевников.'
      - ''
      - '&7Строительная биржа платит за труд:'
      - '&8терраформинг чанка &7— 32–48💎'
      - '&8раскопка чанка до бедрока &7— 256–384💎'
      - '&8незер-метро за 500 блоков &7— 32–48💎'
      - ''
      - '&7Для бездомного это самый честный доход.'

  'status':
    material: GLASS_BOTTLE
    slot: 22
    display_name: '&d&lМоё состояние'
    lore:
      - '&7Зависимость от алкоголя и травы.'
      - ''
      - '&aЛКМ &8— /addiction'
    left_click_commands:
      - '[close]'
      - '[player] addiction'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка: одинаковая во всех меню, чтобы кнопки читались сеткой
