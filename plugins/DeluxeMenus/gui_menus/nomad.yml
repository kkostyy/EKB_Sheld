menu_title: '&8Кочевник'
open_command:
  - nomad
  - кочевник
size: 54

items:

  'nomad_guide':
    material: MAP
    slot: 13
    display_name: '&6&lПутеводитель'
    lore:
      - '&7Кто такой кочевник, земли, гражданство,'
      - '&7беженцы, опасности, дорога, заработок.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_nomad_guide'

  'hire':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2QyNGRjNTgwNjljMTIxMmI1MjlhNGFlNWQ0ZTczYmUwOTkwZDQ2ZmU5MzcxYjFmNzllODE2NGI0Mjg1OWFjOCJ9fX0=
    slot: 20
    display_name: '&2&lМеня можно нанять'
    lore:
      - '&7Город или игрок зовёт тебя на работу,'
      - '&7а цену ты называешь сам.'
      - ''
      - '&7Пока идёт срок, тебя нельзя бить —'
      - '&7и ты не бьёшь никого.'
      - '&8Срок считается ОНЛАЙН-минутами.'
      - ''
      - '&aЛКМ &8— мои заявки и наймы'
    left_click_commands:
      - '[close]'
      - '[player] hire status<delay=2>'

  'hireoff':
    material: BARRIER
    slot: 22
    display_name: '&c&lЗакрыть себя от найма'
    lore:
      - '&7Заявки перестанут приходить.'
      - '&8Вернуть — &b/hire on'
      - ''
      - '&aЛКМ &8— меня нельзя нанять'
    left_click_commands:
      - '[close]'
      - '[player] hire off<delay=2>'

  'status':
    material: GLASS_BOTTLE
    slot: 24
    display_name: '&d&lМоё состояние'
    lore:
      - '&7Зависимость от алкоголя и травы.'
      - ''
      - '&aЛКМ &8— /addiction'
    left_click_commands:
      - '[close]'
      - '[player] addiction<delay=2>'

  'header':
    material: LEATHER_BOOTS
    slot: 4
    display_name: '&7&lКочевник'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
