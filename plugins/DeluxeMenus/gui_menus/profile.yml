  'onair':
    material: REDSTONE_TORCH
    slot: 32
    display_name: '&d&lАнонс эфира'
    lore:
      - '&7Стрим или ролик — на весь сервер.'
      - '&7Бесплатно, раз в 4 часа.'
      - '&8Право Стримера и Ютубера.'
      - ''
      - '&aЛКМ &8— как анонсировать'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.media.streamer
        perm2:
          type: has permission
          permission: ekb.media.youtuber
    left_click_commands:
      - '[message] &d&lЭФИР: &f/onair <текст или ссылка>'

  'pose':
    material: OAK_STAIRS
    slot: 33
    display_name: '&a&lПоза'
    lore:
      - '&7Сесть на месте или лечь.'
      - '&8Отыгрыш: раненый лежит, гость сидит за столом.'
      - ''
      - '&aЛКМ &8— сесть'
      - '&aПКМ &8— лечь'
    left_click_commands:
      - '[player] gsit'
    right_click_commands:
      - '[player] glay'

  'carry':
    material: LEAD
    slot: 34
    display_name: '&6&lНести на руках'
    lore:
      - '&7Взять человека на плечи — раненого до Клиники'
      - '&7или пьяного до дома.'
      - '&8Он принимает: /aceptar, отказ: /rechazar'
      - '&8Отпустить: /soltar'
      - ''
      - '&aЛКМ &8— как это работает'
    left_click_commands:
      - '[message] &6&lНЕСТИ: &7/cargar <ник> &8— запрос человеку'
      - '[message] &8Принять: &7/aceptar &8· Отказать: &7/rechazar &8· Отпустить: &7/soltar'

  'bugreport':
    material: REDSTONE
    slot: 37
    display_name: '&c&lСообщить о баге'
    lore:
      - '&7Не жалоба на игрока, а поломка механики.'
      - '&8Жалобы на людей — кнопка ниже.'
      - ''
      - '&aЛКМ &8— как сообщить'
