menu_title: '&8Профиль'
open_command:
  - profile
  - профиль
size: 54

items:

  'skins':
    material: PLAYER_HEAD
    slot: 13
    display_name: '&f&lСкины'
    lore:
      - '&7Сервер в offline-режиме: скин задаёт плагин.'
      - ''
      - '&aЛКМ &8— каталог скинов'
      - '&aПКМ &8— вернуть стандартный'
    left_click_commands:
      - '[player] skins'
    right_click_commands:
      - '[player] skin clear'

  'skinname':
    material: ARMOR_STAND
    slot: 20
    display_name: '&b&lСкин по нику'
    lore:
      - '&aЛКМ &8— как взять чужой скин'
    left_click_commands:
      - '[message] &8&lСкин: &7/skin set <ник>'

  'freedom':
    material: IRON_DOOR
    slot: 22
    display_name: '&a&lКуда выйти из тюрьмы'
    lore:
      - '&7Кровать, спавн или крыльцо Суда.'
      - '&8Работает только в день освобождения.'
      - ''
      - '&aЛКМ &8— выбрать точку'
    left_click_commands:
      - '[player] freedom'

  'status':
    material: GLASS_BOTTLE
    slot: 24
    display_name: '&d&lСостояние'
    lore:
      - '&7Зависимость, ломка, время без дозы.'
      - ''
      - '&aЛКМ &8— проверить себя'
    left_click_commands:
      - '[player] addiction'

  'mail':
