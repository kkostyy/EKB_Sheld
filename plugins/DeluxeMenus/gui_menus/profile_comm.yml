menu_title: '&8Связь'
open_command:
  - comm
  - связь
size: 54

items:

  'voice':
    material: NOTE_BLOCK
    slot: 13
    display_name: '&d&lГолосовая связь'
    lore:
      - '&7Шёпот, группы, музыка, объявления.'
      - '&8Нужен мод Plasmo Voice из модпака.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_voice'

  'voicemsg':
    material: NOTE_BLOCK
    slot: 20
    display_name: '&d&lГолосовое сообщение'
    lore:
      - '&7Запиши голос и отправь в чат.'
      - '&7Говори в микрофон — потом &e[Готово]&7 и &e[Отправить]&7.'
      - '&8Нужен Plasmo Voice. Хранится 10 минут, до минуты длиной.'
      - '&8В общий чат — тем, кто в радиусе локального чата.'
      - ''
      - '&aЛКМ &8— записать в чат'
      - '&aПКМ &8— лично игроку'
    left_click_commands:
      - '[close]'
      - '[player] vm<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo vmdirect<delay=2>'

  'mail':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzcwNWU2OTI5M2UzMmFmMWQ2ODZlMzcwMTIxNTBiOTc5NDFhZjE4ZWEwNGQwYWJhYzdlNjIxYWUyMjdiMTI4NSJ9fX0=
    slot: 22
    display_name: '&f&lПочта'
    lore:
      - '&aЛКМ &8— как отправить'
      - '&aПКМ &8— очистить почту'
    left_click_commands:
      - '[message] &8&lПочта: &7/mailsend <ник> <текст>'
    right_click_commands:
      - '[player] mailclear'

  'discord':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzcwNWU2OTI5M2UzMmFmMWQ2ODZlMzcwMTIxNTBiOTc5NDFhZjE4ZWEwNGQwYWJhYzdlNjIxYWUyMjdiMTI4NSJ9fX0=
    slot: 24
    display_name: '&9&lПривязка Discord'
    lore:
      - '&7Без привязки на сервер не пускают.'
      - '&7Бот пришлёт код — отправь его боту в личку.'
      - ''
      - '&aЛКМ &8— получить код'
    left_click_commands:
      - '[close]'
      - '[player] discord link<delay=2>'

  'keybind':
    material: TRIPWIRE_HOOK
    slot: 30
    display_name: '&f&lГорячие клавиши'
    lore:
      - '&7Стрелка вниз — это меню.'
      - '&7Переназначить: Настройки → Управление → Keybind.'
      - '&8Нужен мод Keybind из модпака сервера.'
      - ''
      - '&aЛКМ &8— что назначено'
    left_click_commands:
      - '[close]'
      - '[player] kbind list<delay=2>'

  'ignore':
    material: BARRIER
    slot: 31
    display_name: '&c&lЧёрный список'
    lore:
      - '&7Игнор не отменяет УК: оскорбления — в Суд.'
      - ''
      - '&aЛКМ &8— как скрыть игрока'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo ignore<delay=2>'

  'onair':
    material: REDSTONE_TORCH
    slot: 32
    display_name: '&d&lАнонс эфира'
    lore:
      - '&7Стрим или ролик — на весь сервер.'
      - '&7Бесплатно, раз в 4 часа.'
      - '&8Право Стримера и Ютубера.'
      - ''
      - '&aЛКМ &8— как анонсировать'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.media.streamer
        perm2:
          type: has permission
          permission: ekb.media.youtuber
    left_click_commands:
      - '[close]'
      - '[player] ekbdo onair<delay=2>'

  'header':
    material: BELL
    slot: 4
    display_name: '&d&lСвязь'
    lore:
      - '&7С кем и как ты разговариваешь.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

