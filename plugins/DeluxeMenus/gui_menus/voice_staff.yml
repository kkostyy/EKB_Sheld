menu_title: '&8Голос: служебное'
open_command:
  - voicestaff
size: 54

items:

  'voicezone':
    material: GRAY_WOOL
    slot: 13
    display_name: '&3&lЗоны тишины'
    lore:
      - '&7Регион WorldGuard, где голосом не говорят.'
      - '&7Участники региона говорят (судья в зале).'
      - ''
      - '&7Встань в регион и нажми.'
      - '&eПКМ &8— вернуть голос в этом регионе'
      - ''
      - '&aЛКМ &8— сделать зоной тишины'
      - '&aПКМ &8— вернуть голос'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
    left_click_commands:
      - '[player] voicezone add'
    right_click_commands:
      - '[player] voicezone del'

  'voicezone_list':
    material: BOOK
    slot: 20
    display_name: '&3&lСписок зон тишины'
    lore:
      - '&aЛКМ &8— все зоны'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
    left_click_commands:
      - '[player] voicezone list'

  'broadcast':
    material: BELL
    slot: 22
    display_name: '&c&lОбъявление голосом'
    lore:
      - '&7Голос поверх всего, слышно всему миру.'
      - ''
      - '&b/vbroadcast world &8— всему миру'
      - '&b/vbroadcast range <блоков> &8— в радиусе'
      - ''
      - '&7Сбор на заседание Суда, эвакуация,'
      - '&7разгон драки на Спавне.'
      - ''
      - '&aЛКМ &8— объявить'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
        perm2:
          type: has permission
          permission: ekb.menu.helper
    left_click_commands:
      - '[close]'
      - '[player] vbroadcast<delay=2>'

  'priority':
    material: GOAT_HORN
    slot: 24
    display_name: '&6&lПриоритетный голос'
    lore:
      - '&7Твой голос приглушает остальные,'
      - '&7пока ты говоришь.'
      - ''
      - '&7Тоже клавиша, назначается в настройках мода.'
      - '&8Служебное: чтобы дежурного было слышно в толпе.'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
        perm2:
          type: has permission
          permission: ekb.menu.helper

  'spectator':
    material: ENDER_EYE
    slot: 31
    display_name: '&5&lСлух в спектаторе'
    lore:
      - '&7В режиме наблюдателя голос слышно оттуда,'
      - '&7куда смотришь, а не откуда тело.'
      - ''
      - '&8Работает вместе с /ekbmenu spec.'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin

  'header':
    material: COMMAND_BLOCK
    slot: 4
    display_name: '&c&lДля Администрации'
    lore:
      - '&7Кнопки внутри видны по правам.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_voice'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
