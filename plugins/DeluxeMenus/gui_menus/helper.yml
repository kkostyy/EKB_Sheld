menu_title: '&8Помощник администратора'
open_command:
  - helpermenu
  - хмену
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.helper
      deny_commands:
        - '[message] &cЭто меню помощника администратора.'

items:

  'inspect':
    material: WOODEN_AXE
    slot: 13
    display_name: '&6&lИнспектор CoreProtect'
    lore:
      - '&7ЛКМ/ПКМ по блоку — история изменений.'
      - ''
      - '&aЛКМ &8— /co i'
    left_click_commands:
      - '[close]'
      - '[player] co i'

  'lookup':
    material: BOOK
    slot: 20
    display_name: '&e&lПоиск по логам'
    lore:
      - '&8/co lookup u:<ник> t:3h r:20'
      - ''
      - '&7Смотреть можно всё — это и есть'
      - '&7твоя главная работа.'
      - ''
      - '&aЛКМ &8— выбрать игрока и срок'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo colookup'

  'openinv':
    material: ENDER_CHEST
    slot: 22
    display_name: '&5&lЗаглянуть в инвентарь'
    lore:
      - '&8/oi <ник> &7— инвентарь'
      - '&8/oe <ник> &7— эндер-сундук'
      - ''
      - '&4Редактировать нельзя: изъятие краденого'
      - '&4— только по решению Суда.'
      - ''
      - '&aЛКМ &8— инвентарь &8· &aПКМ &8— эндер-сундук'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] ekbmenu inv'
    right_click_commands:
      - '[player] ekbmenu ender'

  'spawnbuild':
    material: BRICKS
    slot: 24
    display_name: '&6&lПраво стройки в городе'
    lore:
      - '&7Главный город закрыт для стройки всем,'
      - '&7кроме Администрации. Нанятым рабочим'
      - '&7право выдаётся поимённо — кликом по голове.'
      - ''
      - '&7Бессрочно, пока не заберёшь тем же кликом.'
      - '&8Вне города разрешение не нужно вовсе.'
      - ''
      - '&aЛКМ &8— открыть список'
    left_click_commands:
      - '[close]'
      - '[player] spawnbuild'

  'vanish':
    material: POTION
    slot: 28
    display_name: '&8&lВаниш'
    lore:
      - '&7Стать невидимым для игроков.'
      - ''
      - '&4Главного админа в ванише ты не увидишь:'
      - '&4право sv.see тебе закрыто намеренно.'
      - ''
      - '&aЛКМ &8— /sv'
    left_click_commands:
      - '[close]'
      - '[player] sv'

  'tp':
    material: ENDER_PEARL
    slot: 29
    display_name: '&b&lСлужебные телепорты'
    lore:
      - '&8/tp <ник> &8· &8/tphere <ник> &8· &8/tppos'
      - ''
      - '&7Только при исполнении: доставка в тюрьму,'
      - '&7выезд по иску, разбор жалоб.'
      - '&4Использовать в личной RP-игре запрещено'
      - '&4— Конституция 1.1.2, это злоупотребление.'
      - ''
      - '&aЛКМ &8— телепорт к игроку'
      - '&aПКМ &8— призвать к себе'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo tpto'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo tphere'

  'tps':
    material: CLOCK
    slot: 30
    display_name: '&a&lTPS сервера'
    lore:
      - '&7Нагрузка и тики.'
      - '&4Профилировщик spark закрыт: он сам'
      - '&4нагружает сервер.'
      - ''
      - '&aЛКМ &8— /spark tps'
    left_click_commands:
      - '[close]'
      - '[player] spark tps'

  'brewery':
    material: POTION
    slot: 31
    display_name: '&6&lБар'
    lore:
      - '&8/brew set <ник> 0 &7— протрезвить'
      - '&8/brew create <рецепт> <качество>'
      - ''
      - '&7Право brewery.admin у тебя есть.'
      - ''
      - '&aЛКМ &8— протрезвить игрока'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo brewset'

  'gamemode':
    material: GRASS_BLOCK
    slot: 32
    display_name: '&a&lРежим игры'
    lore:
      - '&7Творческий — строить и проверять,'
      - '&7наблюдатель — смотреть, не вмешиваясь.'
      - '&8Права essentials.gamemode.* у группы есть.'
      - ''
      - '&eПКМ &8— выживание'
      - ''
      - '&aЛКМ &8— творческий'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] gmc'
    right_click_commands:
      - '[player] gms'

  'denied':
    material: BARRIER
    slot: 33
    display_name: '&4&lЧто тебе закрыто'
    lore:
      - '&8coreprotect.rollback &7— откаты, а с ними'
      - '&7  /sentence, /freeearly, /markethologram'
      - '&8OpenInv.editinv &7— правка чужих инвентарей'
      - '&8sv.see &7— видеть других в ванише'
      - '&8spark.profiler &7— профилирование'
      - '&8plugman.admin &7— управление плагинами'
      - '&8ekb.deathnote.admin &7— Тетрадь Смерти'
      - ''
      - '&7Это не ошибка прав, а устройство группы.'

  'spectator':
    material: ENDER_EYE
    slot: 34
    display_name: '&b&lНаблюдатель'
    lore:
      - '&7Пройти сквозь стены и посмотреть,'
      - '&7что там строят.'
      - ''
      - '&eПКМ &8— вернуться в выживание'
      - ''
      - '&aЛКМ &8— наблюдатель'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] gmsp'
    right_click_commands:
      - '[player] gms'

  'roles':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDEzODk5MDExMWUyYTAwZmJkMTYwMTM0ZTZiNzIxYTk3NzBlODgyZGZjZGEzY2NkMjk0ZTI4NDE5NDM5MDI3ZiJ9fX0=
    slot: 40
    display_name: '&d&lРоли и права'
    lore:
      - '&7Выбираешь голову игрока и щёлкаешь'
      - '&7по ролям: судья, врач, гражданин, должности.'
      - '&cГруппу admin меню не выдаёт вообще.'
      - ''
      - '&aЛКМ &8— открыть раздачу ролей'
    left_click_commands:
      - '[player] ekbroles'

  'header':
    material: PLAYER_HEAD
    slot: 4
    display_name: '&b&lПомощник администратора'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

