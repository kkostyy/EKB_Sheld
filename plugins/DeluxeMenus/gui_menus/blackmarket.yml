menu_title: '&8Теневой Рынок'
open_command:
  - blackmarket
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.shadow.member
      deny_commands:
        - '[message] &cТы не состоишь в Теневом Сообществе. &8Туда не записываются, туда приводят.'

items:

  'coords':
    material: COMPASS
    slot: 13
    display_name: '&c&lКоординаты сбора'
    lore:
      - '&7Место назначает Администрация и меняет его.'
      - '&cНадень Личину до подхода.'
      - ''
      - '&aЛКМ &8— получить точку'
    left_click_commands:
      - '[player] shadowmarket'

  'mask':
    material: CARVED_PUMPKIN
    slot: 20
    display_name: '&8&lЛичина'
    lore:
      - '&7Скин и псевдоним. Ник над головой остаётся.'
      - ''
      - '&aЛКМ &8— переключить'
    left_click_commands:
      - '[player] disguise'

  'rules':
    material: IRON_BARS
    slot: 22
    display_name: '&6&lЧем это грозит'
    lore:
      - '&4Скупка заведомо краденого — УК 7.4:'
      - '&4конфискация товара и штраф по прайсу.'
      - '&7Запроса координат хватает Суду как повода спросить,'
      - '&7что ты там делал: он пишется в лог Администрации.'

  'board':
    material: OAK_SIGN
    slot: 24
    display_name: '&7&lБелая доска лотов'
    lore:
      - '&7Легальные сделки — через неё, а не здесь.'
      - ''
      - '&aЛКМ &8— открыть доску'
    left_click_commands:
      - '[player] lots'

  'header':
    material: NETHER_STAR
    slot: 4
    display_name: '&4&lТеневой Рынок Сообщества'
    lore:
      - '&8Здесь ничего не записывается'
      - '&8и никто ни за что не отвечает.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
