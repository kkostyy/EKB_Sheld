menu_title: '&8Техника'
open_command:
  - gadgets
  - техника
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'drone_black':
    material: BLACK_DYE
    slot: 13
    display_name: '&8&lДрон-камикадзе'
    lore:
      - '&7Запуск: ты становишься наблюдателем,'
      - '&7дрон летит туда, куда смотришь.'
      - ''
      - '&4Взрыв настоящий: CoreProtect пишет, Суд видит.'
      - '&8Только главный админ — у помощника снято.'
      - ''
      - '&aЛКМ &8— чёрный'
      - '&aПКМ &8— белый'
    left_click_commands:
      - '[close]'
      - '[player] drone black<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] drone white<delay=2>'

  'drone_jammer':
    material: LODESTONE
    slot: 20
    display_name: '&c&lГлушилка РЭБ'
    lore:
      - '&7Блок: дрон в зоне теряет связь и падает.'
      - '&eПКМ &8— детектор, показывает купол глушилок'
      - ''
      - '&aЛКМ &8— взять глушилку'
      - '&aПКМ &8— взять детектор'
    left_click_commands:
      - '[close]'
      - '[player] drone jammer<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] drone detector<delay=2>'

  'radiogive':
    material: JUKEBOX
    slot: 22
    display_name: '&6&lВыдать рацию'
    lore:
      - '&7Для ивентов и служб — игроки крафтят сами.'
      - ''
      - '&aЛКМ &8— выбрать игрока'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo radiogive<delay=2>'

  'header':
    material: RECOVERY_COMPASS
    slot: 4
    display_name: '&7&lТехника'
    lore:
      - '&7Выдаётся в руки. Только Администрация.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_allitems'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
