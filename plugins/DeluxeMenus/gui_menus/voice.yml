menu_title: '&8Голосовая связь'
open_command:
  - voice
  - голос
  - рация
size: 54

items:

  'whisper':
    material: FEATHER
    slot: 13
    display_name: '&7&lШёпот'
    lore:
      - '&7Тихий голос на пару блоков — для тех,'
      - '&7кто стоит вплотную.'
      - ''
      - '&7Это КЛАВИША, а не команда: назначь её'
      - '&7в настройках мода, раздел «Активации».'
      - '&8Прямое продолжение локального чата:'
      - '&8расстояние значит и для голоса.'

  'radio':
    material: JUKEBOX
    slot: 20
    display_name: '&6&lРация'
    lore:
      - '&7Блок-рация: частота 1-15, голос уходит'
      - '&7на все рации той же частоты.'
      - ''
      - '&7Крафт: &f3 меди &8/ &fжелезо, проигрыватель, железо'
      - '&8/ &fредстоун, незеритовый слиток, редстоун'
      - '&7ПКМ — приём или передача, Shift+ПКМ — частота.'
      - ''
      - '&7Дальность дают громоотводы-антенны сверху.'
      - '&4Молния в антенну сжигает рацию навсегда.'

  'groups':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDA0NTY1MWMwODNiOTg3MzM4NmFjYzA3YjY2Yzc4MGQ3ZGJjODMxOWRkZWJhYjFkMTM4Y2VhZjA5ZjQ5N2UyNyJ9fX0=
    slot: 22
    display_name: '&b&lГруппы (рация)'
    lore:
      - '&7Своя частота на отряд: слышно только своих,'
      - '&7на любом расстоянии.'
      - ''
      - '&b/groups create <имя>  &8— завести'
      - '&b/groups invite <ник>  &8— позвать'
      - '&b/groups leave        &8— выйти'
      - '&8Договориться на расстоянии как-то надо,'
      - '&8а телепортов на сервере нет.'
      - ''
      - '&aЛКМ &8— мои группы'
    left_click_commands:
      - '[close]'
      - '[player] groups<delay=2>'

  'discs':
    material: MUSIC_DISC_CAT
    slot: 24
    display_name: '&6&lМузыкальные пластинки'
    lore:
      - '&7На пластинку можно записать звук и слушать'
      - '&7его из проигрывателя всем вокруг.'
      - ''
      - '&b/disc burn <ссылка> &8— записать'
      - '&b/disc erase &8— стереть'
      - ''
      - '&4Запись — право Администрации: что играет'
      - '&4в баре, слышно всем, и отвечает за это'
      - '&4тот, кто записал.'
      - ''
      - '&aЛКМ &8— помощь по пластинкам'
    left_click_commands:
      - '[close]'
      - '[player] disc<delay=2>'

  'voice_info':
    material: BOOK
    slot: 30
    display_name: '&e&lКак это устроено'
    lore:
      - '&7Основы, скалк, Simple Voice Chat,'
      - '&7чего не хватает.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_voice_info'

  'voice_staff':
    material: COMMAND_BLOCK
    slot: 31
    display_name: '&c&lДля Администрации'
    lore:
      - '&7Зоны тишины, объявление голосом,'
      - '&7приоритет, слух в спектаторе.'
      - ''
      - '&aЛКМ &8— открыть'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
        perm2:
          type: has permission
          permission: ekb.menu.helper
    left_click_commands:
      - '[openguimenu] ekb_voice_staff'

  'header':
    material: NOTE_BLOCK
    slot: 4
    display_name: '&d&lГолосовая связь'
    lore:
      - '&7Голос слышно по расстоянию, как и чат.'
      - '&7Телепортов нет — далеко услышат не тебя, а рацию.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile_comm'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
