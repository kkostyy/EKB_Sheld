menu_title: '&8Проверка'
open_command:
  - helperlogs
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.helper
      deny_commands:
        - '[message] &cЭто меню помощника администратора.'

items:

  'inspect':
    material: WOODEN_AXE
    slot: 13
    display_name: '&6&lИнспектор CoreProtect'
    lore:
      - '&7ЛКМ/ПКМ по блоку — история изменений.'
      - ''
      - '&aЛКМ &8— /co i'
    left_click_commands:
      - '[close]'
      - '[player] co i<delay=2>'

  'lookup':
    material: BOOK
    slot: 20
    display_name: '&e&lПоиск по логам'
    lore:
      - '&8/co lookup u:<ник> t:3h r:20'
      - ''
      - '&7Смотреть можно всё — это и есть'
      - '&7твоя главная работа.'
      - ''
      - '&aЛКМ &8— выбрать игрока и срок'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo colookup<delay=2>'

  'xray':
    material: DIAMOND_ORE
    slot: 22
    display_name: '&b&lПодозрения X-Ray'
    lore:
      - '&7MinerTrack копит подозрения и никого'
      - '&7не кикает: решает проверка, а не счётчик.'
      - ''
      - '&8Уведомления приходят тебе сами.'
      - ''
      - '&aЛКМ &8— история игрока'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo mtcheck<delay=2>'

  'replays':
    material: ENDER_EYE
    slot: 24
    display_name: '&5&lЗаписи BetterReplay'
    lore:
      - '&7Повтор записанного Администрацией.'
      - '&8Смотреть — можно, писать и удалять — главный админ.'
      - ''
      - '&aЛКМ &8— список записей'
    left_click_commands:
      - '[close]'
      - '[player] replay list<delay=2>'

  'openinv':
    material: ENDER_CHEST
    slot: 31
    display_name: '&5&lЗаглянуть в инвентарь'
    lore:
      - '&8/oi <ник> &7— инвентарь'
      - '&8/oe <ник> &7— эндер-сундук'
      - ''
      - '&4Редактировать нельзя: изъятие краденого'
      - '&4— только по решению Суда.'
      - ''
      - '&aЛКМ &8— инвентарь &8· &aПКМ &8— эндер-сундук'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] ekbmenu inv'
    right_click_commands:
      - '[player] ekbmenu ender'

  'header':
    material: OBSERVER
    slot: 4
    display_name: '&b&lЛоги и записи'
    lore:
      - '&7Кто что делал — по фактам.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_helper'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

