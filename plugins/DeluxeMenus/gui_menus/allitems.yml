menu_title: '&8Каталог вещей'
open_command:
  - allitems
  - вещи
  - newitems
  - новое
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'herbs':
    material: DRIED_KELP
    slot: 13
    display_name: '&2&lКонопля'
    lore:
      - '&7Семена, сырьё, курительное, снадобья.'
      - '&816 предметов, CMD 2001-2016.'
      - ''
      - '&aЛКМ &8— открыть'
    model_data: 2003
    left_click_commands:
      - '[openguimenu] ekb_herbs'

  'drinks':
    material: POTION
    slot: 20
    display_name: '&6&lНапитки'
    lore:
      - '&7Пиво, водки, ликёры, виски, рассол.'
      - '&814 рецептов BreweryX, CMD 1001-1014.'
      - ''
      - '&aЛКМ &8— открыть'
    model_data: 1002
    left_click_commands:
      - '[openguimenu] ekb_drinks'

  'artifacts':
    material: NETHER_STAR
    slot: 22
    display_name: '&5&lОсобые артефакты'
    lore:
      - '&7Шесть предметов, по два на весь мир.'
      - '&8CMD 3001-3006.'
      - ''
      - '&aЛКМ &8— открыть'
    model_data: 3003
    left_click_commands:
      - '[openguimenu] ekb_artifacts'

  'deathnote':
    material: WRITABLE_BOOK
    slot: 24
    display_name: '&8&lТетрадь Смерти'
    lore:
      - '&7Выдать, найти, изъять, кулдаун.'
      - '&8Одна на сервер, лимит в две штуки.'
      - ''
      - '&aЛКМ &8— открыть'
    model_data: 6666
    left_click_commands:
      - '[openguimenu] ekb_deathnote'

  'guns':
    material: CROSSBOW
    slot: 30
    display_name: '&c&lСтволы'
    lore:
      - '&7QualityArmory: 70 стволов и патроны.'
      - '&8Моделей в паке пока нет — выглядят ванилью.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_guns'

  'tables':
    material: PAPER
    slot: 31
    display_name: '&f&lНастольные игры'
    lore:
      - '&7TablePlays: кости, карты, шашки, нарды.'
      - '&8CMD 33000-33790, моделей в паке нет.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_tables'

  'header':
    material: CHEST
    slot: 4
    display_name: '&d&lКаталог вещей сервера'
    lore:
      - '&7Всё кастомное опознаётся по CustomModelData,'
      - '&7поэтому в поиске креатива его нет.'
      - '&7Каждый раздел выдаёт вещи тебе в руки.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin_items'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

