menu_title: '&8Кровавый Сон'
size: 54

items:

  'info':
    material: REDSTONE_BLOCK
    slot: 13
    display_name: '&4&lЧто это и когда'
    lore:
      - '&cПолный PvP, гриф, взрывы и рейды.'
      - '&cCoreProtect выключен — исков по Сну не будет.'
      - '&aПеред началом бэкап, после — откат мира.'
      - '&7Постройки и добыча этой ночи не сохранятся.'
      - ''
      - '&aЛКМ &8— статус и отсчёт'
    left_click_commands:
      - '[player] bloodnight'

  'prepare':
    material: ENDER_CHEST
    slot: 20
    display_name: '&e&lКак подготовиться'
    lore:
      - '&7Откат вернёт мир целиком — и твои потери тоже.'
      - '&7Терять нечего, приобрести тоже.'
      - '&7Смысл Сна в том, что можно всё и без последствий.'

  'schedule':
    material: CLOCK
    slot: 22
    display_name: '&6&lНазначить Сон'
    lore:
      - '&7Объявить ивент и запустить отсчёт.'
      - '&cСам ивент гоняется с хоста: purge.ps1'
      - ''
      - '&aЛКМ &8— как назначить'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: coreprotect.rollback
    left_click_commands:
      - '[message] &4&lСОН: &f/bloodnight через <часов>&8 · отменить: &f/bloodnight отмена'
      - '[message] &8Затем на хосте: &f.\purge.ps1 -Hours 3'

  'header':
    material: REDSTONE_BLOCK
    slot: 4
    display_name: '&4&lКровавый Сон'
    lore:
      - '&7Ночь без правил. Наутро её не было.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_world'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
