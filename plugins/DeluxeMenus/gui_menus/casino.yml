menu_title: '&8Бар и кости'
open_command:
  - casino
  - казино
size: 54

items:

  'hall':
    material: NETHER_STAR
    slot: 13
    display_name: '&6&lБольшой зал'
    lore:
      - '&7Рулетка на 37 лунок, слоты на семь барабанов'
      - '&7и краш: успей забрать, пока не рвануло.'
      - '&7Играют на &fжетоны&7 — их меняет касса.'
      - ''
      - '&8Выигрыш — жетонами, алмазы за них платит Казна.'
      - ''
      - '&aЛКМ &8— войти'
    left_click_commands:
      - '[player] casinohall'

  'roulette':
    material: RED_WOOL
    slot: 20
    display_name: '&c&lРулетка'
    lore:
      - '&7Красное или чёрное — &fx2&7, зеро — &fx24&7.'
      - '&7Колесо честное, 0-36: перевес заведения'
      - '&7лежит в выплатах, а не в броске.'
      - ''
      - '&8Ставка идёт в Казну, выигрыш — из Казны.'
      - ''
      - '&aЛКМ &8— к столу'
    left_click_commands:
      - '[close]'
      - '[player] roulette<delay=2>'

  'slots':
    material: LEVER
    slot: 22
    display_name: '&6&lИгровые автоматы'
    lore:
      - '&7Три одинаковых — &fx18&7.'
      - '&7Два одинаковых — ставка возвращается.'
      - '&8Шесть символов, 216 сочетаний.'
      - ''
      - '&aЛКМ &8— крутить'
    left_click_commands:
      - '[close]'
      - '[player] slots<delay=2>'

  'coinflip':
    material: GOLD_INGOT
    slot: 24
    display_name: '&e&lОрёл или решка'
    lore:
      - '&7Выплата &fx2&7, шанс 45 из 100.'
      - '&8Монета неидеальная, и об этом написано прямо.'
      - ''
      - '&aЛКМ &8— бросить'
    left_click_commands:
      - '[close]'
      - '[player] coinflip<delay=2>'

  'dice':
    material: DROPPER
    slot: 29
    display_name: '&c&lИгра в кости'
    lore:
      - '&7Ставка &b2💎&7, выигрыш &b5💎&7.'
      - '&7Побеждает бросок 5 или 6 — это треть случаев.'
      - '&8У заведения перевес 17%. Казино тут — сток алмазов.'
      - ''
      - '&aЛКМ &8— бросить кости'
    left_click_commands:
      - '[player] dice'

  'lottery':
    material: PAPER
    slot: 30
    display_name: '&6&lЛотерея Спавна'
    lore:
      - '&7Билет &b1💎&7, тираж раз в сутки.'
      - '&7Победитель забирает &f80%&7 банка,'
      - '&7остальное остаётся Казне.'
      - ''
      - '&8Шанс — по числу билетов, но не больше 16 на тираж.'
      - ''
      - '&aЛКМ &8— банк и мои билеты'
      - '&aПКМ &8— купить билеты'
    left_click_commands:
      - '[close]'
      - '[player] lottery<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo lotbuy<delay=2>'

  'casino_cash':
    material: SUNFLOWER
    slot: 31
    display_name: '&e&lКасса и счёт'
    lore:
      - '&7Жетоны, мой счёт, выигрыш лотереи.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_casino_cash'

  'casino_bar':
    material: HONEY_BOTTLE
    slot: 32
    display_name: '&6&lБар'
    lore:
      - '&7Что наливают и стойка бара.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_casino_bar'

  'house':
    material: IRON_DOOR
    slot: 33
    display_name: '&c&lОткрыть / закрыть казино'
    lore:
      - '&7Закрытое казино не принимает ни одной ставки:'
      - '&7ни в зале, ни на рулетке, ни в кости.'
      - '&7Жетоны в кассу сдают и при закрытом.'
      - ''
      - '&8Каждое открытие и закрытие — в лог Discord.'
      - ''
      - '&aЛКМ &8— закрыть'
      - '&aПКМ &8— открыть'
    view_requirement:
      minimum_requirements: 1
      requirements:
        perm1:
          type: has permission
          permission: ekb.duty.dealer
        perm2:
          type: has permission
          permission: ekb.duty.clerk
        perm3:
          type: has permission
          permission: ekb.menu.admin
    left_click_commands:
      - '[close]'
      - '[player] casinoclose<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] casinoopen<delay=2>'

  'header':
    material: DROPPER
    slot: 4
    display_name: '&d&lАзартный уголок Бармена'
    lore:
      - '&7Ставки и выручка идут через Казну.'
      - '&7Играют только в здании казино.'
      - '&7Пустая Казна — заведение закрыто.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_trade'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
