menu_title: '&8Бар и кости'
open_command:
  - casino
  - казино
size: 54

items:

  'roulette':
    material: RED_WOOL
    slot: 13
    display_name: '&c&lРулетка'
    lore:
      - '&7Красное или чёрное — &fx2&7, зеро — &fx24&7.'
      - '&7Колесо честное, 0-36: перевес заведения'
      - '&7лежит в выплатах, а не в броске.'
      - ''
      - '&8Ставка идёт в Казну, выигрыш — из Казны.'
      - ''
      - '&aЛКМ &8— к столу'
    left_click_commands:
      - '[close]'
      - '[player] roulette'

  'slots':
    material: LEVER
    slot: 20
    display_name: '&6&lИгровые автоматы'
    lore:
      - '&7Три одинаковых — &fx18&7.'
      - '&7Два одинаковых — ставка возвращается.'
      - '&8Шесть символов, 216 сочетаний.'
      - ''
      - '&aЛКМ &8— крутить'
    left_click_commands:
      - '[close]'
      - '[player] slots'

  'coinflip':
    material: GOLD_INGOT
    slot: 22
    display_name: '&e&lОрёл или решка'
    lore:
      - '&7Выплата &fx2&7, шанс 45 из 100.'
      - '&8Монета неидеальная, и об этом написано прямо.'
      - ''
      - '&aЛКМ &8— бросить'
    left_click_commands:
      - '[close]'
      - '[player] coinflip'

  'stats':
    material: BOOK
    slot: 24
    display_name: '&f&lМой счёт'
    lore:
      - '&7Победы, проигрыши и сколько сейчас в кассе.'
      - ''
      - '&aЛКМ &8— посмотреть'
    left_click_commands:
      - '[close]'
      - '[player] casinostats'

  'lottery':
    material: PAPER
    slot: 29
    display_name: '&6&lЛотерея Спавна'
    lore:
      - '&7Билет &b1💎&7, тираж раз в сутки.'
      - '&7Победитель забирает &f80%&7 банка,'
      - '&7остальное остаётся Казне.'
      - ''
      - '&8Шанс — по числу билетов, но не больше 16 на тираж.'
      - ''
      - '&aЛКМ &8— банк и мои билеты'
      - '&aПКМ &8— купить билеты'
    left_click_commands:
      - '[close]'
      - '[player] lottery'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo lotbuy'

  'lottery_claim':
    material: CHEST
    slot: 30
    display_name: '&e&lЗабрать выигрыш'
    lore:
      - '&7Если Казна была пуста в день тиража,'
      - '&7выигрыш лежит долгом — он не сгорает.'
      - ''
      - '&aЛКМ &8— получить'
    left_click_commands:
      - '[close]'
      - '[player] lottery claim'

  'dice':
    material: DROPPER
    slot: 31
    display_name: '&c&lИгра в кости'
    lore:
      - '&7Ставка &b2💎&7, выигрыш &b5💎&7.'
      - '&7Побеждает бросок 5 или 6 — это треть случаев.'
      - '&8У заведения перевес 17%. Казино тут — сток алмазов.'
      - ''
      - '&aЛКМ &8— бросить кости'
    left_click_commands:
      - '[player] dice'

  'menu':
    material: POTION
    slot: 32
    display_name: '&e&lЧто наливают'
    lore:
      - '&7Цены полные, по прайс-листу.'
      - '&8Стойка города держит потолок цены,'
      - '&8зарабатывать должны живые бармены.'
      - ''
      - '&aЛКМ &8— меню и цены'
    left_click_commands:
      - '[player] barmenu'

  'shop':
    material: BREWING_STAND
    slot: 33
    display_name: '&6&lСтойка бара'
    lore:
      - '&7Все 13 напитков с ценами.'
      - '&7Единственное место, где напиток покупается.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_barshop'

  'header':
    material: DROPPER
    slot: 4
    display_name: '&d&lАзартный уголок Бармена'
    lore:
      - '&7Ставки и выручка идут через Казну.'
      - '&7Пустая Казна — заведение закрыто.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_trade'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

