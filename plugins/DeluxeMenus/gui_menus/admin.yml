menu_title: '&8Администрация'
open_command:
  - adminmenu
  - амену
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'court':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjY3YTA2MjU3ODBjMGMwZTFiYjdhOGM1MTg5YjAxMDlkNGRlZDQxNDhhYTI3Mzk0MzU4MDQwNjRiOGZhMTZhYiJ9fX0=
    slot: 13
    display_name: '&6&lСуд и логи'
    lore:
      - '&7CoreProtect, выгрузка в Discord, откаты.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_admin_court'

  'jail':
    material: IRON_BARS
    slot: 20
    display_name: '&c&lТюрьма'
    lore:
      - '&7Приговоры, освобождение, имущество.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_admin_jail'

  'items':
    material: CHEST
    slot: 22
    display_name: '&d&lПредметы и вещества'
    lore:
      - '&7Тетрадь, трава, бар, зависимость.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_admin_items'

  'world':
    material: GRASS_BLOCK
    slot: 24
    display_name: '&a&lМир и границы'
    lore:
      - '&7Стадии границы, Chunky, погода.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_admin_world'

  'service':
    material: REDSTONE_TORCH
    slot: 28
    display_name: '&e&lСервис'
    lore:
      - '&7TPS, сохранение, права, скрипты.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_admin_service'

  'setup_treasury':
    material: DIAMOND
    slot: 29
    display_name: '&b&lКазна: установка'
    lore:
      - '&7Казна — физические сундуки, а не число.'
      - '&7Через неё ходят все деньги сервера.'
      - '&8Мало места — добавь ещё сундук.'
      - ''
      - '&aЛКМ &8— команды установки'
      - '&aПКМ &8— баланс'
    left_click_commands:
      - '[message] &b&lКАЗНА: &7/settreasury &8— назначить первый (начинает заново)'
      - '[message] &b&lКАЗНА: &7/addtreasury &8— добавить ещё сундук'
      - '[message] &b&lКАЗНА: &7/deltreasury &8— убрать сундук'
      - '[message] &8Двойной сундук — один контейнер на 54 слота.'
    right_click_commands:
      - '[player] treasury'

  'setup_borders':
    material: FILLED_MAP
    slot: 30
    display_name: '&a&lГраницы государств'
    lore:
      - '&7Глава обходит землю ногами, Администрация'
      - '&7утверждает — и полигон ложится на карту.'
      - ''
      - '&aЛКМ &8— команды границ'
      - '&aПКМ &8— список границ'
    left_click_commands:
      - '[message] &a&lГРАНИЦЫ: &7/borderapply <город> &8— утвердить заявку'
      - '[message] &a&lГРАНИЦЫ: &7/borderdrop <город> &8— снять с карты'
      - '[message] &a&lГРАНИЦЫ: &7/bordercolor <город> <#rrggbb> &8— сменить цвет'
      - '[message] &8Утверждать надо стоя в том же мире: выделение WorldEdit твоё.'
    right_click_commands:
      - '[player] borders'

  'setup_shadow':
    material: NETHER_STAR
    slot: 31
    display_name: '&4&lТеневой Рынок: точка'
    lore:
      - '&7Место сбора и скин Личины.'
      - '&8Координаты видят только участники Сообщества.'
      - ''
      - '&aЛКМ &8— команды точки'
    left_click_commands:
      - '[message] &4&lТЕНЬ: &7/setshadowpoint &8— назначить место сбора (где стоишь)'
      - '[message] &4&lТЕНЬ: &7/setshadowskin <ник> &8— чей скин выдавать за Личину'

  'roles':
    material: NAME_TAG
    slot: 32
    display_name: '&d&lРоли и права'
    lore:
      - '&7Выдать или снять роль головами.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[player] ekbroles'

  'ahelp':
    material: KNOWLEDGE_BOOK
    slot: 33
    display_name: '&b&lСправочник'
    lore:
      - '&aЛКМ &8— все команды в чат'
    left_click_commands:
      - '[player] ahelp'

  'inv':
    material: ENDER_CHEST
    slot: 34
    display_name: '&5&lЧужие инвентари'
    lore:
      - '&7Изъятие краденого — только по суду.'
      - ''
      - '&aЛКМ &8— инвентарь игрока'
      - '&aПКМ &8— эндер-сундук'
    left_click_commands:
      - '[player] ekbmenu inv'
    right_click_commands:
      - '[player] ekbmenu ender'

  'vanish':
    material: POTION
    slot: 39
    display_name: '&8&lВаниш'
    lore:
      - '&aЛКМ &8— стать невидимым'
    left_click_commands:
      - '[player] sv'

  'tps':
    material: CLOCK
    slot: 40
    display_name: '&a&lTPS'
    lore:
      - '&aЛКМ &8— нагрузка сервера'
    left_click_commands:
      - '[player] spark tps'

  'header':
    material: NETHER_STAR
    slot: 4
    display_name: '&c&lАдминистрация (САП)'
    lore:
      - '&7Всё, что делает Администрация,'
      - '&7разложено по разделам.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

