menu_title: '&8Мои лавки'
open_command:
  - myshops
size: 54

items:

  'myshops':
    material: VILLAGER_SPAWN_EGG
    slot: 13
    display_name: '&e&lМои лавки'
    lore:
      - '&7До 3 лавок на игрока.'
      - ''
      - '&aЛКМ &8— список моих лавок'
    left_click_commands:
      - '[player] shopkeeper list'

  'shopegg':
    material: VILLAGER_SPAWN_EGG
    slot: 20
    display_name: '&a&lЗапасное яйцо торговца'
    lore:
      - '&7Этим яйцом кликают по сундуку с товаром.'
      - ''
      - '&aПри первой аренде палатки оно выдаётся'
      - '&aбесплатно — сюда идут, если потеряли.'
      - '&b16💎 &7россыпью, уходят в Казну Спавна.'
      - '&8Выдаёт сам плагин — у его яйца своя метка.'
      - ''
      - '&aЛКМ &8— купить запасное'
    left_click_commands:
      - '[player] shopegg'

  'howto':
    material: CHEST
    slot: 22
    display_name: '&a&lОткрыть ларёк'
    lore:
      - '&aЛКМ &8— инструкция в чат'
    left_click_commands:
      - '[message] &a&lЛАРЁК: &71) сундук на Рынке &8→ &72) товар внутрь'
      - '[message] &73) яйцо торговца кликом по сундуку &8→ &74) продавец рядом (до 15 блоков)'
      - '[message] &75) ПКМ по продавцу — цены. Торгует только тем, что в сундуке.'

  'header':
    material: VILLAGER_SPAWN_EGG
    slot: 4
    display_name: '&a&lМои лавки'
    lore:
      - '&7Лавка торгует из твоего сундука.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_trade'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

