menu_title: '&8Касса и счёт'
open_command:
  - casinocash
size: 54

items:

  'chips':
    material: SUNFLOWER
    slot: 13
    display_name: '&e&lКасса жетонов'
    lore:
      - '&7Алмаз = жетон, в обе стороны, без комиссии.'
      - '&7Покупка — алмазы в Казну, сдача — из Казны.'
      - '&8Пуста Казна — жетоны ждут, не сгорают.'
      - ''
      - '&aЛКМ &8— купить 16 жетонов'
      - '&aПКМ &8— сдать все жетоны'
    left_click_commands:
      - '[close]'
      - '[player] chips buy 16<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] chips sell all<delay=2>'

  'stats':
    material: BOOK
    slot: 20
    display_name: '&f&lМой счёт'
    lore:
      - '&7Победы, проигрыши и сколько сейчас в кассе.'
      - ''
      - '&aЛКМ &8— посмотреть'
    left_click_commands:
      - '[close]'
      - '[player] casinostats<delay=2>'

  'lottery_claim':
    material: CHEST
    slot: 22
    display_name: '&e&lЗабрать выигрыш'
    lore:
      - '&7Если Казна была пуста в день тиража,'
      - '&7выигрыш лежит долгом — он не сгорает.'
      - ''
      - '&aЛКМ &8— получить'
    left_click_commands:
      - '[close]'
      - '[player] lottery claim<delay=2>'

  'lotdraw':
    material: PAPER
    slot: 24
    display_name: '&6&lТираж вне расписания'
    lore:
      - '&7Разыграть банк лотереи прямо сейчас.'
      - '&8Следующий тираж — через сутки после этого.'
      - ''
      - '&aЛКМ &8— разыграть'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.menu.admin
    left_click_commands:
      - '[close]'
      - '[player] lottery draw<delay=2>'

  'header':
    material: SUNFLOWER
    slot: 4
    display_name: '&e&lКасса и счёт'
    lore:
      - '&7Выигрыш платит Казна.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_casino'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
