menu_title: '&8Внешность'
open_command:
  - look
  - внешность
size: 54

items:

  'skins':
    material: texture-%skinsrestorer_texture_id_or_steve%
    slot: 13
    display_name: '&f&lСкины'
    lore:
      - '&7Сервер в offline-режиме: скин задаёт плагин.'
      - ''
      - '&aЛКМ &8— каталог скинов'
      - '&aПКМ &8— вернуть стандартный'
    left_click_commands:
      - '[player] skins'
    right_click_commands:
      - '[player] skin clear'

  'skincolor':
    material: WHITE_WOOL
    slot: 20
    display_name: '&f&lСкины по цвету'
    lore:
      - '&7Все скины сервера, разложенные по цвету одежды.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_skinscolor'

  'skinname':
    material: ARMOR_STAND
    slot: 22
    display_name: '&b&lСкин по нику'
    lore:
      - '&aЛКМ &8— как взять чужой скин'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo skinset<delay=2>'

  'masks':
    material: CARVED_PUMPKIN
    slot: 24
    display_name: '&8&lЛичина'
    lore:
      - '&7Чужой скин и псевдоним вместо ника'
      - '&7в списке игроков.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_masks'

  'header':
    material: ARMOR_STAND
    slot: 4
    display_name: '&f&lВнешность'
    lore:
      - '&7Как тебя видят другие.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

