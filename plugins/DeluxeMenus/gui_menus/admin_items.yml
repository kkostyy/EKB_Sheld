menu_title: '&8Предметы и вещества'
open_command:
  - items
  - предметы
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'deathnote':
    material: WRITABLE_BOOK
    slot: 13
    display_name: '&8&lТетрадь Смерти'
    lore:
      - '&7Выдать, найти, изъять, кулдаун.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_deathnote'

  'addiction':
    material: HONEY_BOTTLE
    slot: 20
    display_name: '&4&lЗависимость'
    lore:
      - '&7Осмотр и лечение — по головам.'
      - ''
      - '&aЛКМ &8— вылечить игрока'
      - '&aПКМ &8— осмотреть игрока'
    left_click_commands:
      - '[player] ekbmenu heal'
    right_click_commands:
      - '[player] ekbmenu info'

  'artifacts':
    material: NETHER_STAR
    slot: 22
    display_name: '&5&lОсобые артефакты'
    lore:
      - '&7Шесть предметов, по два на весь мир.'
      - '&8Лимит ведёт реестр скрипта: плагин так не умеет.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_artifacts'

  'holo':
    material: ITEM_FRAME
    slot: 24
    display_name: '&b&lГолограммы рынка'
    lore:
      - '&aЛКМ &8— список голограмм'
      - '&aПКМ &8— как поставить и убрать'
    left_click_commands:
      - '[player] markethologramlist'
    right_click_commands:
      - '[message] &b&lГолограмма: &7/markethologram <текст> <x> <y>'
      - '[message] &b&lУбрать: &7/markethologramremove <id> &8— id берётся из списка'

  'drill':
    material: ENCHANTED_BOOK
    slot: 30
    display_name: '&b&lЧара: Бур 3×3'
    lore:
      - '&7Кирка ломает плоскость 3×3.'
      - '&7Книгу и кирку кладёшь на наковальню, забираешь кирку.'
      - '&7Копать буром может любой владелец кирки.'
      - ''
      - '&8Клик — выдать книгу СЕБЕ. Другому: /drillbook <ник>.'
      - '&8Источник книги — только выдача и аукцион.'
      - ''
      - '&aЛКМ &8— выдать книгу себе'
    left_click_commands:
      - '[close]'
      - '[player] drillbook'

  'heads':
    material: PLAYER_HEAD
    slot: 31
    display_name: '&e&lКаталог голов'
    lore:
      - '&7100 000 голов, у админа — с выдачей.'
      - ''
      - '&aЛКМ &8— открыть каталог'
    left_click_commands:
      - '[player] headdb'

  'header':
    material: CHEST
    slot: 4
    display_name: '&d&lПредметы и вещества'
    lore:
      - '&7Всё кастомное опознаётся по CustomModelData,'
      - '&7поэтому в поиске креатива его нет.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

