menu_title: '&8Торговля'
open_command:
  - trade
  - торговля
  - shops
size: 54

items:

  'myshops':
    material: VILLAGER_SPAWN_EGG
    slot: 13
    display_name: '&e&lМои лавки'
    lore:
      - '&7До 3 лавок на игрока.'
      - ''
      - '&aЛКМ &8— список моих лавок'
    left_click_commands:
      - '[player] shopkeeper list'

  'shopegg':
    material: VILLAGER_SPAWN_EGG
    slot: 20
    display_name: '&a&lЗапасное яйцо торговца'
    lore:
      - '&7Этим яйцом кликают по сундуку с товаром.'
      - ''
      - '&aПри первой аренде палатки оно выдаётся'
      - '&aбесплатно — сюда идут, если потеряли.'
      - '&b16💎 &7россыпью, уходят в Казну Спавна.'
      - '&8Выдаёт сам плагин — у его яйца своя метка.'
      - ''
      - '&aЛКМ &8— купить запасное'
    left_click_commands:
      - '[player] shopegg'

  'howto':
    material: CHEST
    slot: 22
    display_name: '&a&lОткрыть ларёк'
    lore:
      - '&aЛКМ &8— инструкция в чат'
    left_click_commands:
      - '[message] &a&lЛАРЁК: &71) сундук на Рынке &8→ &72) товар внутрь'
      - '[message] &73) яйцо торговца кликом по сундуку &8→ &74) продавец рядом (до 15 блоков)'
      - '[message] &75) ПКМ по продавцу — цены. Торгует только тем, что в сундуке.'

  'currency':
    material: DIAMOND
    slot: 24
    display_name: '&b&lВалюта'
    lore:
      - '&7Алмаз — монета, алмазный блок — 9.'
      - '&7Блоки идут в ход от 20 алмазов.'

  'heads':
    material: PLAYER_HEAD
    slot: 28
    display_name: '&6&lКаталог голов'
    lore:
      - '&7100 000 голов для декора.'
      - '&4Взять нельзя — только смотреть и искать.'
      - ''
      - '&aЛКМ &8— открыть каталог'
    left_click_commands:
      - '[player] headdb'

  'collegium':
    material: HOPPER
    slot: 29
    display_name: '&a&lТорговая Коллегия'
    lore:
      - '&7Скупщик, аренда палатки, доска лотов.'
      - '&7Всё считается через Казну Спавна.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_market'

  'blackmarket':
    material: NETHER_STAR
    slot: 30
    display_name: '&4&lТеневой Рынок'
    lore:
      - '&7Там, где белый рынок заканчивается.'
      - '&8Видно только Теневому Сообществу.'
      - ''
      - '&aЛКМ &8— открыть'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.shadow.member
    left_click_commands:
      - '[openguimenu] ekb_blackmarket'

  'hire':
    material: LEATHER_BOOTS
    slot: 31
    display_name: '&2&lНаём кочевников'
    lore:
      - '&7Рабочие руки без гражданства:'
