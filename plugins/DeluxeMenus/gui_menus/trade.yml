menu_title: '&8Торговля'
open_command:
  - trade
  - торговля
  - shops
size: 54

items:

  'collegium':
    material: HOPPER
    slot: 13
    display_name: '&a&lТорговая Коллегия'
    lore:
      - '&7Скупщик, аренда палатки, доска лотов.'
      - '&7Всё считается через Казну Спавна.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_market'

  'trade_shops':
    material: VILLAGER_SPAWN_EGG
    slot: 20
    display_name: '&a&lМои лавки'
    lore:
      - '&7Список лавок, яйцо торговца,'
      - '&7как открыть ларёк.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_trade_shops'

  'hire':
    material: LEATHER_BOOTS
    slot: 22
    display_name: '&2&lНаём кочевников'
    lore:
      - '&7Рабочие руки без гражданства:'
      - '&7выбери голову, назначь срок —'
      - '&7цену кочевник назовёт сам.'
      - ''
      - '&7Пока идёт наём, его нельзя бить,'
      - '&7и сам он тоже не дерётся.'
      - '&8Алмазы идут из рук в руки, мимо Казны.'
      - ''
      - '&aЛКМ &8— открыть список'
    left_click_commands:
      - '[close]'
      - '[player] hire<delay=2>'

  'post':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzcwNWU2OTI5M2UzMmFmMWQ2ODZlMzcwMTIxNTBiOTc5NDFhZjE4ZWEwNGQwYWJhYzdlNjIxYWUyMjdiMTI4NSJ9fX0=
    slot: 24
    display_name: '&f&lЛамповая Почта'
    lore:
      - '&7Письмо — 1💎, посылка вещью — 4💎.'
      - '&7Курьер идёт 20 минут.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_pochta'

  'bar':
    material: POTION
    slot: 29
    display_name: '&d&lБар и кости'
    lore:
      - '&7Стойка Спавна и азартный уголок Бармена.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_casino'

  'heads':
    material: PLAYER_HEAD
    slot: 30
    display_name: '&6&lКаталог голов'
    lore:
      - '&7100 000 голов для декора.'
      - '&4Взять нельзя — только смотреть и искать.'
      - ''
      - '&aЛКМ &8— открыть каталог'
    left_click_commands:
      - '[player] headdb'

  'blackmarket':
    material: NETHER_STAR
    slot: 31
    display_name: '&4&lТеневой Рынок'
    lore:
      - '&7Там, где белый рынок заканчивается.'
      - '&8Видно только Теневому Сообществу.'
      - ''
      - '&aЛКМ &8— открыть'
    view_requirement:
      requirements:
        perm1:
          type: has permission
          permission: ekb.shadow.member
    left_click_commands:
      - '[openguimenu] ekb_blackmarket'

  'trade_info':
    material: PAPER
    slot: 32
    display_name: '&f&lЦены и правила'
    lore:
      - '&7Валюта, прайс-лист, запреты рынка.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_trade_info'

  'header':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvM2QyNGRjNTgwNjljMTIxMmI1MjlhNGFlNWQ0ZTczYmUwOTkwZDQ2ZmU5MzcxYjFmNzllODE2NGI0Mjg1OWFjOCJ9fX0=
    slot: 4
    display_name: '&e&lТорговля'
    lore:
      - '&7Ничего не берётся из воздуха:'
      - '&7любая лавка — чей-то сундук.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_main'

  'close':
