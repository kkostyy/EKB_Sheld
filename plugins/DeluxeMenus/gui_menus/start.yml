      - '&7города и Спавн.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_world'

  'header':
    material: KNOWLEDGE_BOOK
    slot: 4
    display_name: '&f&lПервые шаги'
    lore:
      - '&7Телепортов нет, приватов нет.'
      - '&7Всё держится на законах и CoreProtect.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_main'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
