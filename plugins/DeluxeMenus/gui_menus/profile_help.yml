menu_title: '&8Поддержка'
open_command:
  - support
  - поддержка
size: 54

items:

  'bugreport':
    material: REDSTONE
    slot: 13
    display_name: '&c&lСообщить о баге'
    lore:
      - '&7Не жалоба на игрока, а поломка механики.'
      - '&8Жалобы на людей — кнопка ниже.'
      - ''
      - '&aЛКМ &8— как сообщить'
    left_click_commands:
      - '[close]'
      - '[player] bugreport<delay=2>'

  'reports':
    material: BOOK
    slot: 22
    display_name: '&e&lМои жалобы'
    lore:
      - '&aЛКМ &8— что я отправлял'
      - '&aПКМ &8— как пожаловаться'
    left_click_commands:
      - '[player] myreports'
    right_click_commands:
      - '[message] &8&lЖалоба: &7/report <ник> <причина>'

  'header':
    material: WRITABLE_BOOK
    slot: 4
    display_name: '&e&lПоддержка'
    lore:
      - '&7Если что-то сломалось или тебя обидели.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

