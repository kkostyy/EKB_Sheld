menu_title: '&8Торговая Коллегия'
open_command:
  - market
  - коллегия
size: 54

items:

  'buyer':
    material: HOPPER
    slot: 13
    display_name: '&a&lСкупщик в Казну'
    lore:
      - '&7Окно: видно твой груз, щелчком выбираешь,'
      - '&7что отдать. 22 позиции, половина прайса.'
      - '&7Платит Казна Спавна — пустая Казна не купит ничего.'
      - '&8Булыжник 256 шт → 1💎 · песок 128 → 1💎 · железо 16 → 1💎'
      - ''
      - '&aЛКМ &8— открыть окно'
      - '&aПКМ &8— весь список и цены'
    left_click_commands:
      - '[player] skupka'
    right_click_commands:
      - '[player] skupka прайс'

  'rent':
    material: EMERALD
    slot: 20
    display_name: '&e&lАренда палатки'
    lore:
      - '&7Точка 5x5 на Рыночной площади.'
      - '&b5💎&7 за сутки, деньги в Казну Спавна.'
      - ''
      - '&aЯйцо торговца входит в первую аренду —'
      - '&aотдельно покупать не надо.'
      - '&4Неуплата — закрытие точки, УК 7.2.'
      - '&8Срок свой: /arenda оплатить <суток>'
      - ''
      - '&aЛКМ &8— мой срок'
      - '&aПКМ &8— оплатить 7 суток'
    left_click_commands:
      - '[player] arenda'
    right_click_commands:
      - '[player] arenda оплатить'

  'auction':
    material: GOLD_INGOT
    slot: 22
    display_name: '&6&lАукцион'
    lore:
      - '&7Торги за дорогую вещь: все повышают цену.'
      - '&7Вещь и ставки в эскроу, перебитому — возврат.'
      - '&7Торги 30 минут, ставка в последнюю минуту продлевает.'
      - ''
      - '&8Выставить: держи вещь и &f/auction start <цена>'
      - ''
      - '&aЛКМ &8— открыть торги'
    left_click_commands:
      - '[player] auction'

  'lots':
    material: OAK_SIGN
    slot: 24
    display_name: '&6&lДоска лотов'
    lore:
      - '&7Объявления о бартере и личных сделках.'
      - '&8Не аукцион: вещь и алмазы стороны передают сами.'
      - '&8Дорогое за алмазы — лучше через Аукцион выше.'
      - ''
      - '&aЛКМ &8— что на доске'
      - '&aПКМ &8— как выставить'
    left_click_commands:
      - '[player] lots'
    right_click_commands:
      - '[message] &6&lЛОТ: &7возьми вещь в руку и введи &f/lot <цена>'
      - '[message] &8Снять свой: &f/lotdrop <номер>&8. Лот живёт 48 ч.'

  'depot':
    material: BRICKS
    slot: 30
    display_name: '&6&lСклад стройматериалов'
    lore:
      - '&7Сюда ложится то, что сдают скупщику.'
      - '&7Это не Казна: там алмазы, здесь сырьё.'
      - '&8Не влезло — списывается на застройку.'
      - ''
      - '&aЛКМ &8— что на складе'
    left_click_commands:
      - '[player] depot'

  'treasury':
    material: DIAMOND
    slot: 31
    display_name: '&b&lКазна Спавна'
    lore:
      - '&7Сколько у города денег прямо сейчас.'
      - '&7Пополняется арендой, штрафами и конфискатом.'
      - ''
      - '&aЛКМ &8— показать баланс'
    left_click_commands:
      - '[player] treasury'

  'header':
    material: HOPPER
    slot: 4
    display_name: '&a&lТорговая Коллегия Спавна'
    lore:
      - '&7Скупка, аренда и объявления.'
      - '&7Деньги города лежат в сундуке Казны.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_trade'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

