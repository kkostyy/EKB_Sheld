menu_title: '&8Режим'
open_command:
  - helpermode
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.helper
      deny_commands:
        - '[message] &cЭто меню помощника администратора.'

items:

  'vanish':
    material: POTION
    slot: 13
    display_name: '&8&lВаниш'
    lore:
      - '&7Стать невидимым для игроков.'
      - ''
      - '&4Главного админа в ванише ты не увидишь:'
      - '&4право sv.see тебе закрыто намеренно.'
      - ''
      - '&aЛКМ &8— /sv'
    left_click_commands:
      - '[close]'
      - '[player] sv<delay=2>'

  'gamemode':
    material: GRASS_BLOCK
    slot: 20
    display_name: '&a&lРежим игры'
    lore:
      - '&7Творческий — строить и проверять,'
      - '&7наблюдатель — смотреть, не вмешиваясь.'
      - '&8Права essentials.gamemode.* у группы есть.'
      - ''
      - '&eПКМ &8— выживание'
      - ''
      - '&aЛКМ &8— творческий'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] gmc'
    right_click_commands:
      - '[player] gms'

  'spectator':
    material: ENDER_EYE
    slot: 22
    display_name: '&b&lНаблюдатель'
    lore:
      - '&7Пройти сквозь стены и посмотреть,'
      - '&7что там строят.'
      - ''
      - '&eПКМ &8— вернуться в выживание'
      - ''
      - '&aЛКМ &8— наблюдатель'
      - '&aПКМ &8— выполнить'
    left_click_commands:
      - '[player] gmsp'
    right_click_commands:
      - '[player] gms'

  'tp':
    material: ENDER_PEARL
    slot: 24
    display_name: '&b&lСлужебные телепорты'
    lore:
      - '&8/tp <ник> &8· &8/tphere <ник> &8· &8/tppos'
      - ''
      - '&7Только при исполнении: доставка в тюрьму,'
      - '&7выезд по иску, разбор жалоб.'
      - '&4Использовать в личной RP-игре запрещено'
      - '&4— Конституция 1.1.2, это злоупотребление.'
      - ''
      - '&aЛКМ &8— телепорт к игроку'
      - '&aПКМ &8— призвать к себе'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo tpto<delay=2>'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo tphere<delay=2>'

  'header':
    material: COMPASS
    slot: 4
    display_name: '&a&lРежим и перемещение'
    lore:
      - '&7Служебное — игрокам недоступно.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_helper'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

