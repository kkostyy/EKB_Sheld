menu_title: '&8Ламповая Почта'
open_command:
  - pochta
  - почта
size: 54

items:

  'letter':
    material: PAPER
    slot: 13
    display_name: '&e&lОтправить письмо'
    lore:
      - '&7Текст игроку. Марка &b1💎&7 в Казну.'
      - ''
      - '&aЛКМ &8— как отправить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo mailsend<delay=2>'

  'parcel':
    material: CHEST
    slot: 20
    display_name: '&6&lОтправить посылку'
    lore:
      - '&7Вещь из главной руки. Марка &b4💎&7 в Казну.'
      - '&cВещь изымается сразу — иначе почта возила бы копии.'
      - ''
      - '&aЛКМ &8— как отправить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo parcel<delay=2>'

  'box':
    material: BARREL
    slot: 22
    display_name: '&a&lМой ящик'
    lore:
      - '&7Что мне идёт и что я отправил.'
      - ''
      - '&aЛКМ &8— открыть ящик'
    left_click_commands:
      - '[player] mailbox'

  'clear':
    material: LAVA_BUCKET
    slot: 24
    display_name: '&c&lВыбросить письма'
    lore:
      - '&7Только письма. Посылки не трогаются:'
      - '&7в них чужие вещи, а это Глава 1 УК.'
      - ''
      - '&aЛКМ &8— выбросить'
    left_click_commands:
      - '[player] mailclear'

