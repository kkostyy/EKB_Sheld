menu_title: '&8Тёмное ремесло'
open_command:
  - assassin
  - ремесло
size: 54

items:

  'contracts':
    material: OAK_SIGN
    slot: 13
    display_name: '&c&lКонтракты'
    lore:
      - '&7Доска, свои заказы, взятые дела.'
      - '&8Раньше эти три кнопки лежали и здесь, и в /contracts.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_contracts'

  'rules':
    material: IRON_BARS
    slot: 20
    display_name: '&6&lЧем это грозит'
    lore:
      - '&7Исполнителю — тюрьма от 10ч и возврат вещей.'
      - '&7Заказчику — двойной депозит штрафом и тюрьма.'
      - '&7Дело заводят по показаниям свидетелей.'
      - ''
      - '&aЛКМ &8— статьи в чат'
    left_click_commands:
      - '[message] &6&lУК 5.2: &7отвечают оба — и исполнитель, и заказчик.'
      - '[message] &6&lУК 5.3: &7свидетели в 48 блоках получают уведомление.'

  'shadow':
    material: NETHER_STAR
    slot: 22
    display_name: '&4&lТеневой Рынок'
    lore:
      - '&7Место сбора знают только свои.'
      - '&8Туда не записываются. Туда приводят.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_blackmarket'

  'safety':
    material: SPYGLASS
    slot: 24
    display_name: '&8&lКак не попасться'
    lore:
      - '&7Свидетелем считается любой в 48 блоках.'
      - '&7Работай там, где никого нет, — и помни,'
      - '&7что CoreProtect видит больше, чем люди.'

  'header':
    material: IRON_SWORD
    slot: 4
    display_name: '&4&lТёмное ремесло'
    lore:
      - '&4Это профессия вне закона.'
      - '&4Контракт не оправдывает — статья УК 5.2.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
