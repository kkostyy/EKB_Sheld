menu_title: '&8Дипломатия'
open_command:
  - diplomacy
size: 54

items:

  'ally':
    material: GOLDEN_APPLE
    slot: 13
    display_name: '&a&lСоюзники'
    lore:
      - '&7До 4 союзов. Союзники не бьют друг друга,'
      - '&7если PvP города выключено.'
      - ''
      - '&aЛКМ &8— как заключить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clanally<delay=2>'

  'enemy':
    material: IRON_SWORD
    slot: 20
    display_name: '&c&lВраги'
    lore:
      - '&7До 2 враждующих городов.'
      - '&4Война без объявления в Discord за 24 часа —'
      - '&4нарушение Конституции 1.2.'
      - ''
      - '&aЛКМ &8— как объявить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clanenemy<delay=2>'

  'pvp':
    material: SHIELD
    slot: 22
    display_name: '&6&lPvP между своими'
    lore:
      - '&7Бьют ли жители города друг друга.'
      - '&7Выключено — удар по своему не проходит.'
      - ''
      - '&aЛКМ &8— переключить'
    left_click_commands:
      - '[player] clan pvp'

  'header':
    material: WHITE_BANNER
    slot: 4
    display_name: '&b&lДипломатия'
    lore:
      - '&7Война объявляется здесь, а ведётся — в поле.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_town_settings'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

