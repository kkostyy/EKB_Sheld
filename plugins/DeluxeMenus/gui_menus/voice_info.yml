menu_title: '&8Как устроен голос'
open_command:
  - voiceinfo
size: 54

items:

  'basics':
    material: JUKEBOX
    slot: 13
    display_name: '&f&lКак это работает'
    lore:
      - '&7Голос идёт по расстоянию: 8, 16 или 32 блока'
      - '&7— дальность выбирается в настройках мода.'
      - ''
      - '&7Клавиши и громкость — там же, в меню'
      - '&7Plasmo Voice (по умолчанию &fV&7).'
      - '&8Мода нет — тебя просто не слышно, кик за это не будет.'

  'sculk':
    material: SCULK_SENSOR
    slot: 20
    display_name: '&3&lДатчик скалка слышит голос'
    lore:
      - '&7Скалковые датчики и вардены реагируют'
      - '&7на живой голос так же, как на шаги.'
      - ''
      - '&4В Глубоком Тёмном молчи.'

  'svc':
    material: NOTE_BLOCK
    slot: 22
    display_name: '&b&lSimple Voice Chat'
    lore:
      - '&7Друг играет с Simple Voice Chat, а не Plasmo?'
      - '&7Вы всё равно слышите друг друга — сервер'
      - '&7переводит голос между модами сам.'

  'mods':
    material: WRITABLE_BOOK
    slot: 24
    display_name: '&e&lЧего не хватает'
    lore:
      - '&7Всё это работает только с модом'
      - '&7Plasmo Voice — он есть в модпаке сервера.'
      - ''
      - '&8Без мода ты слышишь и говоришь в обычный чат,'
      - '&8и ничего больше не ломается.'

  'header':
    material: BOOK
    slot: 4
    display_name: '&e&lКак это устроено'
    lore:
      - '&7Справка, а не настройки.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_voice'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
