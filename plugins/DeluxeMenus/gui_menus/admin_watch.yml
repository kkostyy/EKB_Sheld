menu_title: '&8Наблюдение'
open_command:
  - adminwatch
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'spec':
    material: ENDER_EYE
    slot: 13
    display_name: '&5&lНаблюдение за игроком'
    lore:
      - '&7Головы тех, кто в сети. Клик по голове —'
      - '&7и ты рядом с ним: сразу в ванише'
      - '&7и в спектаторе, без подтверждения.'
      - ''
      - '&7Обратно на своё место — &b/specback'
      - '&8Только главный админ: судье и помощнику'
      - '&8невидимая слежка не выдаётся.'
      - ''
      - '&aЛКМ &8— выбрать игрока'
    left_click_commands:
      - '[player] ekbmenu spec'

  'dossier':
    material: WRITTEN_BOOK
    slot: 20
    display_name: '&b&lДосье на игрока'
    lore:
      - '&7Всё об игроке одним окном: тюрьма,'
      - '&7приговоры, зависимость, должности,'
      - '&7право стройки, наём, подполье.'
      - ''
      - '&8Раньше это были семь разных команд.'
      - ''
      - '&aЛКМ &8— выбрать игрока'
    left_click_commands:
      - '[player] ekbmenu dossier'

  'inv':
    material: ENDER_CHEST
    slot: 22
    display_name: '&5&lЧужие инвентари'
    lore:
      - '&7Изъятие краденого — только по суду.'
      - ''
      - '&aЛКМ &8— инвентарь игрока'
      - '&aПКМ &8— эндер-сундук'
    left_click_commands:
      - '[player] ekbmenu inv'
    right_click_commands:
      - '[player] ekbmenu ender'

  'vanish':
    material: POTION
    slot: 24
    display_name: '&8&lВаниш'
    lore:
      - '&aЛКМ &8— стать невидимым'
    left_click_commands:
      - '[player] sv'

  'header':
    material: SPYGLASS
    slot: 4
    display_name: '&b&lНаблюдение'
    lore:
      - '&7Смотреть — не значит вмешиваться.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
