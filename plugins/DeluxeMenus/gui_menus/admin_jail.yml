menu_title: '&8Тюрьма'
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'info':
    material: COMPASS
    slot: 13
    display_name: '&b&lКто сидит'
    lore:
      - '&7Точка тюрьмы, заключённые и остаток срока,'
      - '&7содержимое судейского ящика.'
      - ''
      - '&aЛКМ &8— /jailinfo'
    left_click_commands:
      - '[close]'
      - '[player] jailinfo'

  'sentence':
    material: IRON_BARS
    slot: 20
    display_name: '&c&lПосадить'
    lore:
      - '&8/sentence <ник> <минут>'
      - ''
      - '&7Срок идёт ТОЛЬКО пока игрок в сети.'
      - '&7При посадке инвентарь целиком уходит'
      - '&7в судейский ящик, в камере нельзя ломать'
      - '&7и ставить, эндер-жемчуг не телепортирует.'
      - '&7Есть, пить и курить — можно.'
      - ''
      - '&aЛКМ &8— выполнить'
    left_click_commands:
      - '[player] ekbmenu jail'

  'free':
    material: LIME_DYE
    slot: 22
    display_name: '&a&lОсвободить досрочно'
    lore:
      - '&8/freeearly <ник>'
      - ''
      - '&7Освобождённый сам выберет в меню, куда выйти:'
      - '&7кровать, спавн или крыльцо Суда.'
      - ''
      - '&aЛКМ &8— выполнить'
    left_click_commands:
      - '[player] ekbmenu free'

  'items':
    material: CHEST
    slot: 24
    display_name: '&6&lСудейский ящик'
    lore:
      - '&8/jailitems list [ник] &7— что изъято'
      - '&8/jailitems give <ник> &7— вернуть владельцу'
      - '&8/jailitems clear <ник> &7— конфисковать в Казну'
      - ''
      - '&7Выдача откажет, если в рюкзаке меньше'
      - '&7свободных слотов, чем предметов в ящике.'
      - ''
      - ''
      - '&8Shift+ЛКМ &8— список ящиков'
      - ''
      - '&aЛКМ &8— разобрать ящик по предметам'
      - '&aПКМ &8— вернуть всё сразу'
    left_click_commands:
      - '[player] jailprop'
    right_click_commands:
      - '[player] ekbmenu items'

  'setjail':
    material: BEACON
    slot: 30
    display_name: '&e&lТочка тюрьмы'
    lore:
      - '&7Встань в камере и нажми — координаты'
      - '&7запишутся как место отбывания срока.'
      - ''
      - '&aЛКМ &8— /setjailpoint'
    left_click_commands:
      - '[close]'
      - '[player] setjailpoint'

  'setcourt':
    material: OAK_DOOR
    slot: 31
    display_name: '&e&lКрыльцо Суда'
    lore:
      - '&7Точка, куда выходят освобождённые,'
      - '&7если выберут её в меню выхода.'
      - ''
      - '&aЛКМ &8— /setcourtpoint'
    left_click_commands:
      - '[close]'
      - '[player] setcourtpoint'

  'header':
    material: IRON_BARS
    slot: 4
    display_name: '&c&lТюрьма'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
