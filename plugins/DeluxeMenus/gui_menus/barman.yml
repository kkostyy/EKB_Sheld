menu_title: '&8Бармен'
open_command:
  - barman
  - бармен
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.duty.barman
      deny_commands:
        - '[message] &cЭто меню бармена.'

items:

  'sober':
    material: MILK_BUCKET
    slot: 13
    display_name: '&f&lВытрезвить гостя'
    lore:
      - '&7Снимает опьянение. Зависимость остаётся:'
      - '&7её лечит только Клиника за 64-160💎.'
      - ''
      - '&aЛКМ &8— выбрать гостя'
    left_click_commands:
      - '[player] ekbmenu sober'

  'check':
    material: SPYGLASS
    slot: 20
    display_name: '&e&lСостояние гостя'
    lore:
      - '&7Сколько выпил и близко ли к ломке.'
      - ''
      - '&aЛКМ &8— осмотреть гостя'
    left_click_commands:
      - '[player] ekbmenu info'

  'shop':
    material: BREWING_STAND
    slot: 22
    display_name: '&6&lСтойка Спавна'
    lore:
      - '&7Цены полные, по прайс-листу.'
      - '&7Свой бар на Shopkeepers имеет смысл'
      - '&7ровно тогда, когда дешевле стойки города.'
      - ''
      - '&aЛКМ &8— открыть стойку'
    left_click_commands:
      - '[openguimenu] ekb_barshop'

  'prices':
    material: PAPER
    slot: 24
    display_name: '&f&lПрайс в чат'
    lore:
      - '&aЛКМ &8— все 13 напитков'
    left_click_commands:
      - '[player] barmenu'

  'brew':
    material: CAULDRON
    slot: 30
    display_name: '&a&lКак варить своё'
    lore:
      - '&7Котёл, бочка, дистиллятор — механика BreweryX.'
      - '&7Свой напиток дешевле покупного у города.'
      - ''
      - '&aЛКМ &8— памятка в чат'
    left_click_commands:
      - '[message] &a&lBREWERY: &7котёл над огнём -> ингредиенты -> черпнуть бутылкой'
      - '[message] &a&lBREWERY: &7крепкое — перегнать в дистилляторе,'
      - '[message] &a&lBREWERY: &7выдержанное — в дубовой бочке.'
      - '[message] &8Рецепты сервера: plugins/BreweryX/recipes.yml'

  'shops':
    material: VILLAGER_SPAWN_EGG
    slot: 31
    display_name: '&e&lМои лавки'
    lore:
      - '&aЛКМ &8— список'
    left_click_commands:
      - '[player] shopkeeper list'

  'header':
    material: BREWING_STAND
    slot: 4
    display_name: '&6&lБармен Спавна'
    lore:
      - '&7Наливает и отвечает за тех, кто перебрал.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty_spawn'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

