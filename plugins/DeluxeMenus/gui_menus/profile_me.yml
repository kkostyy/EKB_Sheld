menu_title: '&8Моё состояние'
open_command:
  - mystate
  - состояние
size: 54

items:

  'status':
    material: GLASS_BOTTLE
    slot: 13
    display_name: '&d&lСостояние'
    lore:
      - '&7Зависимость, ломка, время без дозы.'
      - ''
      - '&aЛКМ &8— проверить себя'
    left_click_commands:
      - '[player] addiction'

  'playtime':
    material: CLOCK
    slot: 20
    display_name: '&e&lВремя в игре'
    lore:
      - '&7Сегодня: &f%playerTime_today_minutes%&7 мин'
      - '&7За неделю: &f%playerTime_week_hours%&7 ч'
      - '&7За месяц: &f%playerTime_month_hours%&7 ч'
      - '&7Всего: &f%playerTime_total_hours%&7 ч  &e%playerTime_total_level%'
      - ''
      - '&8Считает PlayerTime: только время в сети.'
      - ''
      - '&aЛКМ &8— в чат'
    left_click_commands:
      - '[message] &e&lВремя в игре: &7сегодня &f%playerTime_today_minutes%&7 мин, неделя &f%playerTime_week_hours%&7 ч, всего &f%playerTime_total_hours%&7 ч'

  'freedom':
    material: IRON_DOOR
    slot: 22
    display_name: '&a&lКуда выйти из тюрьмы'
    lore:
      - '&7Кровать, спавн или крыльцо Суда.'
      - '&8Работает только в день освобождения.'
      - ''
      - '&aЛКМ &8— выбрать точку'
    left_click_commands:
      - '[player] freedom'

  'header':
    material: CLOCK
    slot: 4
    display_name: '&d&lМоё состояние'
    lore:
      - '&7Как ты сейчас.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
