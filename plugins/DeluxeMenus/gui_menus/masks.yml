menu_title: '&8Личина'
open_command:
  - masks
  - маски
size: 54

items:

  'toggle':
    material: CARVED_PUMPKIN
    slot: 13
    display_name: '&8&lНадеть или снять Личину'
    lore:
      - '&7Чужой скин и псевдоним вместо ника'
      - '&7в списке игроков и над головой префиксом.'
      - '&7Псевдоним тот же, что на доске контрактов.'
      - ''
      - '&aЛКМ &8— переключить'
    left_click_commands:
      - '[player] disguise'

  'truth':
    material: PLAYER_HEAD
    slot: 20
    display_name: '&e&lЧего Личина НЕ даёт'
    lore:
      - '&cНик над головой не скрывается.'
      - '&7TAB такого не умеет, а Суду нужна ниточка:'
      - '&7без неё дела по Главе 2 УК вести нельзя.'
      - '&7Кто стоит рядом — тебя узнает.'

  'skins':
    material: ARMOR_STAND
    slot: 22
    display_name: '&f&lОбычные скины'
    lore:
      - '&7Сервер в offline-режиме: скин задаёт плагин.'
      - ''
      - '&aЛКМ &8— каталог скинов'
      - '&aПКМ &8— вернуть свой'
    left_click_commands:
      - '[player] skins'
    right_click_commands:
      - '[player] skin clear'

  'shadow':
    material: NETHER_STAR
    slot: 24
    display_name: '&4&lТеневой Рынок'
    lore:
      - '&7Личину надевают до подхода, а не на месте.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_blackmarket'

  'header':
    material: CARVED_PUMPKIN
    slot: 4
    display_name: '&8&lГардероб и Личина'
    lore:
      - '&7Анонимность тут отыгрышная, а не техническая.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_profile'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
