menu_title: '&8Наёмники САП'
open_command:
  - mercs
  - наёмники
size: 54

items:

  'rules':
    material: WRITTEN_BOOK
    slot: 13
    display_name: '&e&lКак это работает'
    lore:
      - '&7Сотрудник САП может выйти в поле как обычный'
      - '&7игрок — без админ-команд, ваниша и телепортов'
      - '&7(Конституция 6.3). На это время он наёмник.'
      - ''
      - '&f1. &7Забронируй услугу кнопкой ниже.'
      - '&f2. &7Заявка уйдёт Администрации.'
      - '&f3. &7Условия и срок согласуете в Discord.'
      - '&f4. &7Оплата — алмазами, из рук в руки'
      - '&7   или через Суд как гаранта.'
      - ''
      - '&4Наёмник не применяет служебные полномочия'
      - '&4в интересах нанимателя — это Трибунал.'

  'guard':
    material: SHIELD
    slot: 20
    display_name: '&a&lОхрана каравана'
    lore:
      - '&7Сопровождение груза между городами.'
      - '&7Один маршрут, туда и обратно.'
      - ''
      - '&7Цена: &f64–96💎'
      - ''
      - '&aЛКМ &8— забронировать'
    left_click_commands:
      - '[close]'
      - '[message] &aЗаявка отправлена. Условия согласуй в Discord.'

  'siege':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDA0NTY1MWMwODNiOTg3MzM4NmFjYzA3YjY2Yzc4MGQ3ZGJjODMxOWRkZWJhYjFkMTM4Y2VhZjA5ZjQ5N2UyNyJ9fX0=
    slot: 22
    display_name: '&c&lУчастие в войне'
    lore:
      - '&7Наёмник воюет на стороне города как'
      - '&7обычный боец: своя броня, свои риски.'
      - ''
      - '&7Цена: &f256–384💎 &7за объявленную войну'
      - ''
      - '&4Война должна быть объявлена по правилам'
      - '&4— за 24 часа в &f#военный-трибунал&4.'
      - '&4Наёмника на незаконное нападение не берут.'
      - ''
      - '&aЛКМ &8— забронировать'
    left_click_commands:
      - '[close]'
      - '[message] &aЗаявка отправлена. Война должна быть объявлена по правилам.'

  'builder':
    material: DIAMOND_PICKAXE
    slot: 24
    display_name: '&6&lСтроительные работы'
    lore:
      - '&7Руками, без админ-инструментов.'
      - ''
      - '&7Терраформинг чанка — &f32–48💎'
      - '&7Плато 5×5 чанков — &f256–512💎'
      - '&7Раскопка чанка до бедрока — &f256–384💎'
      - '&7Незер-метро за 500 блоков — &f32–48💎'
      - ''
      - '&aЛКМ &8— забронировать'
    left_click_commands:
      - '[close]'
      - '[message] &aЗаявка отправлена. Объём работ согласуй в Discord.'

  'escort':
    material: LEAD
    slot: 30
    display_name: '&b&lКонвой заключённого'
    lore:
      - '&7Доставка осуждённого в тюрьму и охрана'
      - '&7во время срока — служебная работа САП,'
      - '&7она бесплатна и делается по решению Суда.'
      - ''
      - '&7Нанимать её нельзя: это не услуга,'
      - '&7а обязанность.'

  'wanted':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDA0NTY1MWMwODNiOTg3MzM4NmFjYzA3YjY2Yzc4MGQ3ZGJjODMxOWRkZWJhYjFkMTM4Y2VhZjA5ZjQ5N2UyNyJ9fX0=
    slot: 31
    display_name: '&4&lЗаказ на игрока'
    lore:
      - '&7Такой услуги нет и не будет.'
      - ''
      - '&7Убийство по найму — это грабёж с убийством'
      - '&7(УК 1.2): возмещение, штраф 32–64💎'
      - '&7и тюрьма от 10 часов. И заказчику тоже.'
      - ''
      - '&7Хочешь чужого добра — иди в Суд.'

  'header':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDA0NTY1MWMwODNiOTg3MzM4NmFjYzA3YjY2Yzc4MGQ3ZGJjODMxOWRkZWJhYjFkMTM4Y2VhZjA5ZjQ5N2UyNyJ9fX0=
    slot: 4
