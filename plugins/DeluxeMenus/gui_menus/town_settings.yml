menu_title: '&8Настройки города'
size: 54

items:

  'border':
    material: FILLED_MAP
    slot: 13
    display_name: '&a&lГраница государства'
    lore:
      - '&7Обойди свою землю ногами: встань в углу'
      - '&7и отметь его, потом иди по меже дальше.'
      - '&7Многоугольник ляжет на веб-карту.'
      - '&8Утверждает Администрация. От 3 углов до 20.'
      - ''
      - '&aЛКМ &8— как обойти'
      - '&aПКМ &8— все границы'
    left_click_commands:
      - '[message] &a&lГРАНИЦА: &7/border start <город> &8— начать обход'
      - '[message] &a&lГРАНИЦА: &7/border point &8— отметить угол, стоя в нём'
      - '[message] &a&lГРАНИЦА: &7/border undo &8· &7/border show &8· &7/border finish'
      - '[message] &8Граница — витрина, а не приват: чужую застройку разбирает Суд.'
    right_click_commands:
      - '[player] borders'

  'clanchat':
    material: PAPER
    slot: 20
    display_name: '&a&lЧат города'
    lore:
      - '&7Отдельный канал для своих.'
      - '&7Слышно только жителям города, на любом расстоянии.'
      - ''
      - '&aЛКМ &8— переключить канал'
    left_click_commands:
      - '[player] clanchat'

  'prefix':
    material: NAME_TAG
    slot: 22
    display_name: '&e&lПрефикс города'
    lore:
      - '&7Тег города в чате и в списке игроков.'
      - ''
      - '&aЛКМ &8— как сменить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clanprefix'

  'ally':
    material: GOLDEN_APPLE
    slot: 24
    display_name: '&a&lСоюзники'
    lore:
      - '&7До 4 союзов. Союзники не бьют друг друга,'
      - '&7если PvP города выключено.'
      - ''
      - '&aЛКМ &8— как заключить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clanally'

  'enemy':
    material: IRON_SWORD
    slot: 28
    display_name: '&c&lВраги'
    lore:
      - '&7До 2 враждующих городов.'
      - '&4Война без объявления в Discord за 24 часа —'
      - '&4нарушение Конституции 1.2.'
      - ''
      - '&aЛКМ &8— как объявить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clanenemy'

  'pvp':
    material: SHIELD
    slot: 29
    display_name: '&6&lPvP между своими'
    lore:
      - '&7Бьют ли жители города друг друга.'
      - '&7Выключено — удар по своему не проходит.'
      - ''
      - '&aЛКМ &8— переключить'
    left_click_commands:
      - '[player] clan pvp'

  'transfer':
    material: GOLDEN_HELMET
    slot: 30
    display_name: '&6&lПередать город'
    lore:
      - '&7Новый глава получает всё, старый становится жителем.'
      - '&4В демократии смена главы мимо голосования —'
      - '&4узурпация, статья 3a Конституции.'
      - ''
      - '&aЛКМ &8— как передать'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo clantransfer'

  'disband':
    material: TNT
    slot: 31
    display_name: '&4&lРаспустить город'
    lore:
      - '&cБезвозвратно: город, союзы и очки исчезают.'
      - '&7Постройки и сундуки остаются — их никто не трогает,'
      - '&7но защиты у них и не было.'
      - ''
      - '&aЛКМ &8— как распустить'
    left_click_commands:
      - '[message] &4&lРОСПУСК: &7/clan disband'
      - '[message] &cКоманда сработает сразу, подтверждения нет.'

  'roles':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOTFiMGE1YmJjNjk3YzBjNDJhNmNmMWI5YzRjNDQzNWIwNzMyMmZjZTViYjI3ZDgyYjY5MzA4NDNlNWFiN2EwOSJ9fX0=
    slot: 32
    display_name: '&d&lДолжности в городе'
    lore:
      - '&7Советник, казначей, страж — это права,'
      - '&7а не роли ClansLite. Раздаёт Администрация.'
      - ''
      - '&aЛКМ &8— кто за что отвечает'
    left_click_commands:
      - '[openguimenu] ekb_town_gov'

  'treasury':
    material: CHEST
    slot: 33
    display_name: '&b&lКазна города'
    lore:
      - '&7Казна города — обычный сундук с алмазами'
      - '&7под присмотром казначея. Плагином она не считается:'
      - '&7её можно вскрыть, и это дело Суда (Глава 1 УК).'
      - '&8Казна Спавна — другое: /treasury'
      - ''
      - '&aЛКМ &8— казна Спавна для сравнения'
    left_click_commands:
      - '[player] treasury'

  'header':
    material: COMPARATOR
    slot: 4
    display_name: '&6&lНастройки города'
    lore:
      - '&7Меняет только глава города.'
      - '&7Аргументы вводятся в чат: в GUI их негде набрать.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_town'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

  # рамка ставится генератором, руками её не правят
