menu_title: '&8Тёмная Тетрадь Смерти'
open_command:
  - deathnotemenu
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.deathnote.admin
      deny_commands:
        - '[message] &cТетрадь — забота главного админа.'

items:

  'self':
    material: WRITABLE_BOOK
    slot: 13
    display_name: '&a&lВыдать себе'
    lore:
      - '&7Тетрадь ляжет тебе в руки.'
      - ''
      - '&aЛКМ &8— выдать себе'
    model_data: 6666
    left_click_commands:
      - '[player] givenote'

  'pick':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjY3YTA2MjU3ODBjMGMwZTFiYjdhOGM1MTg5YjAxMDlkNGRlZDQxNDhhYTI3Mzk0MzU4MDQwNjRiOGZhMTZhYiJ9fX0=
    slot: 20
    display_name: '&e&lВыдать игроку'
    lore:
      - '&7Выбор головой из тех, кто в сети.'
      - ''
      - '&aЛКМ &8— выбрать игрока'
    left_click_commands:
      - '[player] ekbmenu deathnote'

  'random':
    material: ENDER_PEARL
    slot: 22
    display_name: '&5&lВыдать случайному'
    lore:
      - '&7Тетрадь сама найдёт хозяина.'
      - ''
      - '&aЛКМ &8— случайный игрок'
    left_click_commands:
      - '[player] deathnote give random'

  'find':
    material: COMPASS
    slot: 24
    display_name: '&b&lГде она сейчас'
    lore:
      - '&7Ищет в инвентарях и эндер-сундуках онлайна.'
      - ''
      - '&aЛКМ &8— найти тетрадь'
    left_click_commands:
      - '[player] deathnote find'

  'scan':
    material: SPYGLASS
    slot: 29
    display_name: '&6&lПолный обыск'
    lore:
      - '&7Сундуки, эндер-сундуки, выброшенное,'
      - '&7запомненные схроны — всё разом.'
      - '&8Пропала на 10 минут — можно выдавать заново.'
      - ''
      - '&aЛКМ &8— искать везде'
    left_click_commands:
      - '[player] dnscan'

  'info':
    material: BOOK
    slot: 30
    display_name: '&f&lСостояние'
    lore:
      - '&7Сколько выдано, кулдаун, последний владелец.'
      - ''
      - '&aЛКМ &8— показать сводку'
    left_click_commands:
      - '[player] deathnote info'

  'reclaim':
    material: HOPPER
    slot: 31
    display_name: '&c&lИзъять'
    lore:
      - '&7У онлайн-игрока забирает сама,'
      - '&7у оффлайн — открывает /oi и /oe.'
      - ''
      - '&aЛКМ &8— выбрать игрока'
    left_click_commands:
      - '[player] ekbmenu reclaim'

  'cooldown':
    material: CLOCK
    slot: 32
    display_name: '&6&lКулдаун'
    lore:
      - '&7Сколько тетрадь «сыта» после приговора.'
      - ''
      - '&aЛКМ &8— как изменить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo dncooldown'

  'count':
    material: PAPER
    slot: 33
    display_name: '&7&lСчётчик выданных'
    lore:
      - '&7Если разошёлся с реальностью.'
      - ''
      - '&aЛКМ &8— как поправить'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo dncount'

  'header':
    material: WRITABLE_BOOK
    slot: 4
    display_name: '&8&lТёмная Тетрадь Смерти'
    lore:
      - '&7На сервере не больше двух тетрадей.'
      - '&7Счётчик расходится — поправь вручную.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin_items'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

