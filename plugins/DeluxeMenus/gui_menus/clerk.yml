menu_title: '&8Приказчик Мэрии'
open_command:
  - clerk
  - приказчик
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.duty.clerk
      deny_commands:
        - '[message] &cЭто меню приказчика Мэрии.'

items:

  'depot':
    material: BRICKS
    slot: 13
    display_name: '&6&lСклад стройматериалов'
    lore:
      - '&7Запас сырья на застройку Спавна.'
      - '&7Полный склад — сданное начинает списываться,'
      - '&7так что разгружать его твоя работа.'
      - ''
      - '&aЛКМ &8— что на складе'
    left_click_commands:
      - '[player] depot'

  'treasury':
    material: DIAMOND
    slot: 20
    display_name: '&b&lКазна Спавна'
    lore:
      - '&7Сколько у города денег прямо сейчас'
      - '&7и в каких сундуках они лежат.'
      - '&8Мало места — Администрация добавляет сундук: /addtreasury'
      - ''
      - '&aЛКМ &8— баланс'
      - '&aПКМ &8— журнал движений'
    left_click_commands:
      - '[player] treasury'
    right_click_commands:
      - '[player] treasurylog'

  'rent':
    material: EMERALD
    slot: 22
    display_name: '&e&lАрендаторы'
    lore:
      - '&7Кто держит палатку и сколько ему осталось.'
      - '&4Просрочка — закрытие точки, УК 7.2.'
      - '&7Сносить и трогать сундуки нельзя: имущество'
      - '&7возвращают по решению Суда, а не по таймеру.'
      - ''
      - '&aЛКМ &8— список арендаторов'
    left_click_commands:
      - '[player] arenda список'

  'buyer':
    material: HOPPER
    slot: 24
    display_name: '&a&lСкупщик'
    lore:
      - '&7Половина прайса, платит Казна.'
      - ''
      - '&aЛКМ &8— открыть окно'
      - '&aПКМ &8— список и цены'
    left_click_commands:
      - '[player] skupka'
    right_click_commands:
      - '[player] skupka прайс'

  'lots':
    material: OAK_SIGN
    slot: 30
    display_name: '&6&lДоска лотов'
    lore:
      - '&aЛКМ &8— что на доске'
    left_click_commands:
      - '[player] lots'

  'calls':
    material: BELL
    slot: 31
    display_name: '&e&lЗаявки в Мэрию'
    lore:
      - '&aЛКМ &8— открытые заявки'
    left_click_commands:
      - '[player] calls'

  'market':
    material: CHEST
    slot: 32
    display_name: '&f&lТорговая Коллегия'
    lore:
      - '&7Весь раздел целиком.'
      - ''
      - '&aЛКМ &8— открыть'
    left_click_commands:
      - '[openguimenu] ekb_market'

  'header':
    material: LECTERN
    slot: 4
    display_name: '&b&lПриказчик Мэрии'
    lore:
      - '&7Держит Казну Спавна и Рыночную площадь.'
      - '&7Пустая Казна — скупщик стоит.'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_duty'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

