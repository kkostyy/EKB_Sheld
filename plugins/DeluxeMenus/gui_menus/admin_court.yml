menu_title: '&8Суд и логи'
size: 54
open_requirement:
  requirements:
    perm:
      type: has permission
      permission: ekb.menu.admin
      deny_commands:
        - '[message] &cЭто меню Администрации.'

items:

  'inspect':
    material: WOODEN_AXE
    slot: 13
    display_name: '&6&lИнспектор CoreProtect'
    lore:
      - '&7ЛКМ/ПКМ по блоку показывает его историю.'
      - '&7Конституция 1.2: спор решает только он.'
      - ''
      - '&aЛКМ &8— /co i'
    left_click_commands:
      - '[close]'
      - '[player] co i'

  'lookup':
    material: BOOK
    slot: 20
    display_name: '&e&lПоиск по логам'
    lore:
      - '&8/co lookup u:<ник> t:<время> r:<радиус>'
      - '&8/co lookup u:Вася t:3h r:20'
      - ''
      - '&7Время: &fm &7минуты, &fh &7часы, &fd &7дни.'
      - ''
      - '&aЛКМ &8— выбрать игрока и срок'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo colookup'

  'courtlog':
    material: WRITABLE_BOOK
    slot: 22
    display_name: '&b&lВыгрузка в Discord'
    lore:
      - '&8/courtlog <игрок> <минуты> <радиус> <дело>'
      - ''
      - '&7Плагин CourtBridge тянет логи CoreProtect'
      - '&7и шлёт embed в канал &f#суд&7.'
      - '&7Номер дела берётся из Discord-бота.'
      - ''
      - '&aЛКМ &8— собрать выгрузку по шагам'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo courtlog'

  'rollback':
    material: TNT
    slot: 24
    display_name: '&c&lОткат'
    lore:
      - '&8/co rollback u:<ник> t:<время> r:<радиус>'
      - '&8/co restore ... &7— вернуть обратно'
      - ''
      - '&4Только по решению Суда.'
      - '&8Помощник админа этого права не имеет.'
      - ''
      - '&aЛКМ &8— собрать откат по шагам'
      - '&aПКМ &8— вернуть откат обратно'
    left_click_commands:
      - '[close]'
      - '[player] ekbdo corollback'
    right_click_commands:
      - '[close]'
      - '[player] ekbdo corestore'

  'discord':
    material: LAPIS_LAZULI
    slot: 31
    display_name: '&9&lДела в Discord'
    lore:
      - '&8/иск &7— подача (игроки)'
      - '&8/дела &7— список открытых'
      - '&8/закрыть_дело <номер> &7— закрыть'
      - ''
      - '&7Номера дел живут в боте, а не на сервере:'
      - '&7CoreProtect держит базу локально и по сети'
      - '&7её не отдаёт. Связка — номер дела.'

  'header':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjY3YTA2MjU3ODBjMGMwZTFiYjdhOGM1MTg5YjAxMDlkNGRlZDQxNDhhYTI3Mzk0MzU4MDQwNjRiOGZhMTZhYiJ9fX0=
    slot: 4
    display_name: '&c&lСуд и логи'

  'back':
    material: ARROW
    slot: 45
    display_name: '&7Назад'
    left_click_commands:
      - '[openguimenu] ekb_admin'

  'close':
    material: BARRIER
    slot: 49
    display_name: '&cЗакрыть'
    left_click_commands:
      - '[close]'

