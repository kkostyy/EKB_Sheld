# EKB SHIELD — plugins/AttackThrough/config.yml
# AttackThrough 1.0.2 (Modrinth, bukkit/folia/paper/purpur/spigot, 26.1.2).
# Позволяет бить сущность СКВОЗЬ прозрачный блок — забор, стекло, листву,
# решётку. Ванильная игра в такой ситуации бьёт по блоку.
#
# Зачем на этом сервере: тюрьма (docs/jail_online_time.sk) и загоны для
# животных строятся на заборах и решётках, и «не могу ударить через прутья»
# ломало бы и конвой, и разделку скота.
#
# ⚠️ onlyForTools: true — сквозь блок бьют только инструменты и оружие.
# Рука и обычный предмет работают по-ванильному, то есть ставят/ломают блок.
# Иначе игрок не смог бы положить блок за забором: клик уходил бы в моба.

# Дальность удара от игрока до сущности за блоком, в блоках.
# 4 — ванильная дистанция атаки; выше ставить нельзя, это уже reach-чит.
reach: 4

# Толщина луча поиска цели за блоком. Дефолт плагина, трогать без нужды
# не стоит: шире — начнёт цеплять соседних мобов, уже — промахи по краям.
raySize: 0.2

onlyForTools: true
