gamemode=survival
difficulty=hard
allow-flight=true
pvp=true
snooper-enabled=false
# --- ОФЛАЙН-РЕЖИМ (решение от 15.09.2026) ---
# Лицензии нет, поэтому проверка аккаунтов Mojang отключена.
# ПОСЛЕДСТВИЯ, которые надо держать в голове:
#  * UUID теперь считаются из ника, а не выдаются Mojang. Смена режима обратно
#    обнулит привязки LuckPerms, CoreProtect, тюрьмы и дел суда.
#  * Ник больше не гарантирует личность — отсюда обязательный AuthMeReloaded.
#  * Порт 25565 нельзя пробрасывать наружу без нужды: без авторизации
#    любой может зайти под ником администрации.
online-mode=false
enable-command-block=true
max-players=100
view-distance=12
simulation-distance=6
sync-chunk-writes=false
network-compression-threshold=256
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
resource-pack=https\://download.mc-packs.net/pack/04f45a4edb2a4c8e887d642160e54b006de890c6.zip
resource-pack-sha1=04f45a4edb2a4c8e887d642160e54b006de890c6
require-resource-pack=true
resource-pack-prompt={"text":"Для игры на EKB SHIELD требуется загрузить 3D-ресурспак!","color":"gold"}

# --- RCON: нужен скриптам expand_border.ps1 / backup.ps1 (Windows) ---
# Порт слушает только локально; наружу его открывать НЕ надо.
enable-rcon=true
rcon.port=25575
rcon.password=ВСТАВЬ_ПАРОЛЬ_RCON
broadcast-rcon-to-ops=false

# --- Сид мира (задан вручную 16.09.2026) ---
# Применяется ТОЛЬКО при генерации нового мира: у существующего world/
# сид зашит в level.dat и эта строка на него не влияет.
level-seed=1719851759463503585

# --- Защита спавна: выключена намеренно (18.09.2026) ---
# Приват Спавна держит WorldGuard-регион `spawn` (build_spawn_region.py,
# 384x384 блока, Конституция 6.2). Ванильная spawn-protection закрывает
# 33x33 блока вокруг точки появления ВСЕМ, кроме операторов, и она сильнее
# WorldGuard: Строительная бригада, добавленная в members региона, всё равно
# не смогла бы строить в центре Спавна, а причину пришлось бы искать в
# настройках WorldGuard, где её нет. Две системы защиты на одну площадь —
# это не «надёжнее», а «непонятно, какая сработала».
spawn-protection=0
