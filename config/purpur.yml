# EKB SHIELD — патч для server/purpur.yml
#
# ⚠️ ЭТО НЕ КОПИЯ КОНФИГА, А ПАТЧ. Purpur генерирует свой purpur.yml
# (~2000 строк) при первом запуске и держит его В КОРНЕ сервера, а не в
# config/. Здесь перечислены только те ключи, которые проект меняет;
# накатывает их скрипт:
#
#       py -3 apply_server_configs.py            # показать, что изменится
#       py -3 apply_server_configs.py --write    # применить
#
# Скрипт правит значения по месту, сохраняя остальные две тысячи строк и
# комментарии Purpur. Простым копированием этот файл ставить НЕЛЬЗЯ.
#
# ⚠️ ГРАБЛИ, НА КОТОРЫЕ УЖЕ НАСТУПИЛИ (найдено 18.09.2026).
# 1. setup.sh/setup.ps1 клали этот файл в $SERVER_DIR/config/ — туда, где
#    Purpur его не ищет. Настройки не работали ни дня, и определить это
#    по конфигу было нельзя: файл лежал, выглядел применённым.
# 2. Ключа settings.lobotomize-enabled у Purpur не существует. Настоящий
#    путь — world-settings.default.mobs.villager.lobotomize.enabled, а
#    неизвестный ключ Purpur, как и Paper, проглатывает молча.
# Оба пункта — одна и та же ловушка: «настройка выглядит включённой и
# не работает». Сверяй путь ключа с ЖИВЫМ server/purpur.yml, а не по памяти.

settings:
  # Более дешёвая проверка живости соединения вместо ванильной.
  use-alternate-keepalive: true

world-settings:
  default:
    mobs:
      villager:
        lobotomize:
          # Жители в 1x1 «лоботомируются»: перестают считать маршруты, но
          # торгуют. Массовые торговые залы на Спавне перестают есть тик.
          enabled: true
    gameplay-mechanics:
      player:
        # Нужно для скипа ночи при 25% спящих (датапак ekb_border, ekb:init).
        # При false геймрул playersSleepingPercentage не делает ничего.
        can-skip-night: true
