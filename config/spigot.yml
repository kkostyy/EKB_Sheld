# EKB SHIELD — патч для server/spigot.yml
#
# ⚠️ ЭТО НЕ КОПИЯ КОНФИГА, А ПАТЧ — см. шапку config/purpur.yml.
# spigot.yml тоже лежит в КОРНЕ сервера, а не в config/, и до 18.09.2026
# эти настройки не применялись: файл уезжал в $SERVER_DIR/config/spigot.yml.
#
#       py -3 apply_server_configs.py --write

world-settings:
  default:
    # Вдвое больше динамита за тик. Безопасно только вместе с
    # environment.optimize-explosions: true в paper-world-defaults.yml —
    # иначе каждый взрыв считает лучи по-ванильному.
    max-tnt-per-tick: 200

    # Дропнутые вещи живут 5 минут, стрелы — минуту. Это ванильные значения,
    # записаны явно: автоочистку предметов проект запрещает (ClearLag и
    # подобные — см. deploy_checklist §1b), потому что дроп — это улики и
    # чужое имущество, а Ст. 1-4 УК требуют возврата вещей по решению Суда.
    item-despawn-rate: 6000
    arrow-despawn-rate: 1200

    # Радиусы, в которых сущность вообще тикает. Дефолты Spigot вдвое шире
    # (32/32/64/16) — на сервере с фермами и торговыми залами это и есть
    # основной расход тика. Рейдеров оставили большими: набег на город
    # должен доходить до города, а не замирать на границе прогрузки.
    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 48
      misc: 8
